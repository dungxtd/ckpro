packages:
  - "desktop"
  - "packages/*"

# Dependencies whose install scripts run: the PostHog CLI fetches its binary
# (release builds upload source maps with it); core-js only prints a notice
allowBuilds:
  "@posthog/cli": true
  core-js: false

minimumReleaseAgeExclude:
  - "@tauri-apps/api@2.12.5"
  - "@tauri-apps/cli-darwin-arm64@2.12.5"
  - "@tauri-apps/cli-darwin-x64@2.12.5"
  - "@tauri-apps/cli-linux-arm-gnueabihf@2.12.5"
  - "@tauri-apps/cli-linux-arm64-gnu@2.12.5"
  - "@tauri-apps/cli-linux-arm64-musl@2.12.5"
  - "@tauri-apps/cli-linux-riscv64-gnu@2.12.5"
  - "@tauri-apps/cli-linux-x64-gnu@2.12.5"
  - "@tauri-apps/cli-linux-x64-musl@2.12.5"
  - "@tauri-apps/cli-win32-arm64-msvc@2.12.5"
  - "@tauri-apps/cli-win32-ia32-msvc@2.12.5"
  - "@tauri-apps/cli-win32-x64-msvc@2.12.5"
  - "@tauri-apps/cli@2.12.5"
