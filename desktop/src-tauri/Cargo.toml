[package]
name = "ckdry"
version = "0.1.0"
description = "ckdry - Kubernetes exam practice"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ckdry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = "0.21.1"
tokio = { version = "1.54.1", features = ["full"] }
futures-util = "0.3.34"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "0.0.13"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.28.0", features = ["v1_35"] }
tokio-util = "0.7.20"
tar = "0.4.46"
bytes = "1.12.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde-saphyr = "2.0.0"
schemars = "1.2.3"
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
dirs = "7.0.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
