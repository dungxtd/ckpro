    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: probes-pod
      namespace: observability
    spec:
      containers:
      - name: nginx
        image: nginx
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
