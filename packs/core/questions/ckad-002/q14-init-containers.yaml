        image: nginx
        volumeMounts:
        - name: log-volume
          mountPath: /shared
      initContainers:
      - name: sidecar-container
        image: busybox
        command: ['sh', '-c', 'until nslookup myservice; do echo waiting for myservice; sleep 2; done']
        volumeMounts:
        - name: log-volume
          mountPath: /shared
      volumes:
