# yaml-language-server: $schema=../../../schema/question.schema.json
title: Multi-container Pods
certifications:
  ckad: application-design-build
difficulty: hard
namespace: multi-container
tags: [multi-container-pods, volumes, namespaces]

statement: |
  Create a Pod named `multi-container-pod` in the `multi-container` namespace with
  two containers:
  1. Container 1 -
  Name: `main-container`,
  Image: `nginx`
  2. Container 2 -
  Name: `sidecar-container`,
  Image: `busybox`,
  Command: `['sh', '-c', 'while true; do echo $(date) >> /var/log/app.log; sleep 5; done']`

  Create a shared volume named `log-volume` that both containers can access. Mount this volume at `/var/log` in both containers. Ensure the namespace exists before creating the pod.

setup: |
  # Delete the pod-concepts namespace if it exists
  echo "Setting up environment for Question 2 (Multi-Container Pod)..."
  kubectl delete namespace pod-concepts --ignore-not-found=true

  # Wait for deletion to complete
  sleep 2

  # Confirm environment is ready
  echo "Environment ready for Question 2"
  exit 0

checks:
  - name: Namespace is created
    run: |
      # Validate that the multi-container namespace exists
      NS=$(kubectl get namespace multi-container -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$NS" == "multi-container" ]]; then
          # Namespace exists
          exit 0
      else
          # Namespace does not exist
          echo "Namespace 'multi-container' does not exist"
          exit 1
      fi
  - name: Pod exists with two containers
    weight: 2
    run: |
      # Validate that the multi-container-pod exists
      POD=$(kubectl get pod multi-container-pod -n multi-container -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$POD" == "multi-container-pod" ]]; then
          # Pod exists, now check if it has two containers
          CONTAINER_COUNT=$(kubectl get pod multi-container-pod -n multi-container -o jsonpath='{.spec.containers}' 2>/dev/null | jq '. | length')

          if [[ "$CONTAINER_COUNT" == "2" ]]; then
              # Pod has two containers
              exit 0
          else
              echo "Pod 'multi-container-pod' does not have two containers. Found: $CONTAINER_COUNT"
              exit 1
          fi
      else
          # Pod does not exist
          echo "Pod 'multi-container-pod' does not exist in the 'multi-container' namespace"
          exit 1
      fi
  - name: Container images are correct
    weight: 2
    run: |
      # Validate that the container images are correct
      MAIN_CONTAINER_IMAGE=$(kubectl get pod multi-container-pod -n multi-container -o jsonpath='{.spec.containers[?(@.name=="main-container")].image}' 2>/dev/null)
      SIDECAR_CONTAINER_IMAGE=$(kubectl get pod multi-container-pod -n multi-container -o jsonpath='{.spec.containers[?(@.name=="sidecar-container")].image}' 2>/dev/null)

      if [[ "$MAIN_CONTAINER_IMAGE" == "nginx" ]]; then
          # Main container image is correct
          if [[ "$SIDECAR_CONTAINER_IMAGE" == "busybox" ]]; then
              # Sidecar container image is correct
              exit 0
          else
              echo "Sidecar container image is incorrect. Found: $SIDECAR_CONTAINER_IMAGE (expected: busybox)"
              exit 1
          fi
      else
          echo "Main container image is incorrect. Found: $MAIN_CONTAINER_IMAGE (expected: nginx)"
          exit 1
      fi
  - name: Shared volume is configured correctly
    weight: 3
    run: |
      # Validate that the shared volume is configured correctly
      # Check if volume exists
      VOLUME_NAME=$(kubectl get pod multi-container-pod -n multi-container -o jsonpath='{.spec.volumes[?(@.name=="log-volume")].name}' 2>/dev/null)

      if [[ "$VOLUME_NAME" == "log-volume" ]]; then
          # Volume exists, now check if it's mounted in both containers
          MAIN_CONTAINER_MOUNT=$(kubectl get pod multi-container-pod -n multi-container -o jsonpath='{.spec.containers[?(@.name=="main-container")].volumeMounts[?(@.name=="log-volume")]}' 2>/dev/null)
          SIDECAR_CONTAINER_MOUNT=$(kubectl get pod multi-container-pod -n multi-container -o jsonpath='{.spec.containers[?(@.name=="sidecar-container")].volumeMounts[?(@.name=="log-volume")].mountPath}' 2>/dev/null)

          if [[ "$MAIN_CONTAINER_MOUNT" == *"/var/log"* && "$SIDECAR_CONTAINER_MOUNT" == "/var/log" ]]; then
              # Both containers have the volume mounted at the correct path
              exit 0
          else
              echo "Volume mounts are not configured correctly."
              echo "Main container mount path: $MAIN_CONTAINER_MOUNT (expected: /var/log)"
              echo "Sidecar container mount path: $SIDECAR_CONTAINER_MOUNT (expected: /var/log)"
              exit 1
          fi
      else
          echo "Volume 'log-volume' does not exist in pod 'multi-container-pod'"
          exit 1
      fi

solution:
  explain: |
    Create a multi-container pod with a shared volume:

    ```bash
    # Create namespace
    kubectl create namespace multi-container

    # Create multi-container pod with shared volume
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Namespace
    metadata:
      name: multi-container
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: multi-container-pod
      namespace: multi-container
    spec:
      containers:
      - name: main-container
        image: nginx
        volumeMounts:
        - name: log-volume
          mountPath: /var/log
        - name: log-volume
          mountPath: /var/log/nginx
          subPath: nginx
      - name: sidecar-container
        image: busybox
        command: ['sh', '-c', 'while true; do echo $(date) >> /var/log/app.log; sleep 5; done']
        volumeMounts:
        - name: log-volume
          mountPath: /var/log
      volumes:
      - name: log-volume
        emptyDir: {}
    EOF
    ```
