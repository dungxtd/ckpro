# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X ckad-002 question 4
title: "Configuration - ConfigMaps & Secrets"
certifications:  # review: domains guessed from concepts
  ckad: application-environment-configuration-security
difficulty: hard
namespace: configuration
tags: [configmaps, secrets, environment-variables, volumes]

statement: |
  Create a ConfigMap named `app-config` in the `configuration` namespace
  with the following data:
  `DB_HOST=mysql`
  `DB_PORT=3306`
  `DB_NAME=myapp`

  Then create a Secret named `app-secret`
  with the following data:
  `DB_USER=admin`
  `DB_PASSWORD=s3cr3t`

  Finally, create a Pod named `app-pod` using the `nginx` image that uses both the ConfigMap and Secret.

  Mount the ConfigMap as environment variables and the Secret as a volume at `/etc/app-secret`. Ensure the namespace exists before creating the resources.

setup: |
  # Delete the config-management namespace if it exists
  echo "Setting up environment for Question 4 (ConfigMap)..."
  kubectl delete namespace config-management --ignore-not-found=true

  # Wait for deletion to complete
  sleep 2

  # Confirm environment is ready
  echo "Environment ready for Question 4"
  exit 0

checks:
  - name: Namespace is created
    run: |
      # Validate that the configuration namespace exists
      NS=$(kubectl get namespace configuration -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$NS" == "configuration" ]]; then
          # Namespace exists
          exit 0
      else
          # Namespace does not exist
          echo "Namespace 'configuration' does not exist"
          exit 1
      fi
  - name: ConfigMap is created correctly
    weight: 2
    run: |
      # Validate that the app-config ConfigMap exists
      CONFIGMAP=$(kubectl get configmap app-config -n configuration -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$CONFIGMAP" == "app-config" ]]; then
          # ConfigMap exists, now check data
          DB_HOST=$(kubectl get configmap app-config -n configuration -o jsonpath='{.data.DB_HOST}' 2>/dev/null)
          DB_PORT=$(kubectl get configmap app-config -n configuration -o jsonpath='{.data.DB_PORT}' 2>/dev/null)
          DB_NAME=$(kubectl get configmap app-config -n configuration -o jsonpath='{.data.DB_NAME}' 2>/dev/null)

          if [[ "$DB_HOST" == "mysql" && "$DB_PORT" == "3306" && "$DB_NAME" == "myapp" ]]; then
              # ConfigMap has correct data
              exit 0
          else
              echo "ConfigMap 'app-config' does not have correct data."
              echo "Found DB_HOST: $DB_HOST (expected: mysql)"
              echo "Found DB_PORT: $DB_PORT (expected: 3306)"
              echo "Found DB_NAME: $DB_NAME (expected: myapp)"
              exit 1
          fi
      else
          # ConfigMap does not exist
          echo "ConfigMap 'app-config' does not exist in the 'configuration' namespace"
          exit 1
      fi
  - name: Secret is created correctly
    weight: 2
    run: |
      # Validate that the app-secret Secret exists
      SECRET=$(kubectl get secret app-secret -n configuration -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$SECRET" == "app-secret" ]]; then
          # Secret exists, now check data
          # Get base64 encoded values
          DB_USER_B64=$(kubectl get secret app-secret -n configuration -o jsonpath='{.data.DB_USER}' 2>/dev/null)
          DB_PASSWORD_B64=$(kubectl get secret app-secret -n configuration -o jsonpath='{.data.DB_PASSWORD}' 2>/dev/null)

          # Decode base64 values
          DB_USER=$(echo $DB_USER_B64 | base64 -d 2>/dev/null)
          DB_PASSWORD=$(echo $DB_PASSWORD_B64 | base64 -d 2>/dev/null)

          if [[ "$DB_USER" == "admin" && "$DB_PASSWORD" == "s3cr3t" ]]; then
              # Secret has correct data
              exit 0
          else
              echo "Secret 'app-secret' does not have correct data."
              echo "Found DB_USER: $DB_USER (expected: admin)"
              echo "Found DB_PASSWORD: $DB_PASSWORD (expected: s3cr3t)"
              exit 1
          fi
      else
          # Secret does not exist
          echo "Secret 'app-secret' does not exist in the 'configuration' namespace"
          exit 1
      fi
  - name: Pod uses ConfigMap as environment variables
    weight: 2
    run: |
      # Validate that the pod uses ConfigMap as environment variables
      POD=$(kubectl get pod app-pod -n configuration -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$POD" == "app-pod" ]]; then
          # Pod exists, now check if it uses ConfigMap as environment variables
          CONFIG_MAP_ENV=$(kubectl get pod app-pod -n configuration -o jsonpath='{.spec.containers[0].envFrom[?(@.configMapRef.name=="app-config")].configMapRef.name}' 2>/dev/null)

          if [[ "$CONFIG_MAP_ENV" == "app-config" ]]; then
              # Pod uses ConfigMap as environment variables
              exit 0
          else
              echo "Pod 'app-pod' does not use ConfigMap 'app-config' as environment variables"
              exit 1
          fi
      else
          # Pod does not exist
          echo "Pod 'app-pod' does not exist in the 'configuration' namespace"
          exit 1
      fi
  - name: Pod mounts Secret as volume
    weight: 2
    run: |
      # Validate that the pod mounts Secret as a volume
      POD=$(kubectl get pod app-pod -n configuration -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$POD" == "app-pod" ]]; then
          # Pod exists, now check if it mounts Secret as a volume
          # First check if the pod has a volume with the secret
          SECRET_VOLUME=$(kubectl get pod app-pod -n configuration -o jsonpath='{.spec.volumes[?(@.secret.secretName=="app-secret")].secret.secretName}' 2>/dev/null)

          # Then check if the volume is mounted at the correct path
          MOUNT_PATH=$(kubectl get pod app-pod -n configuration -o jsonpath='{.spec.containers[0].volumeMounts[?(@.mountPath=="/etc/app-secret")].mountPath}' 2>/dev/null)

          if [[ "$SECRET_VOLUME" == "app-secret" && "$MOUNT_PATH" == "/etc/app-secret" ]]; then
              # Pod mounts Secret as a volume at the correct path
              exit 0
          else
              echo "Pod 'app-pod' does not mount Secret 'app-secret' as a volume at '/etc/app-secret'"
              echo "Found secret volume: $SECRET_VOLUME"
              echo "Found mount path: $MOUNT_PATH"
              exit 1
          fi
      else
          # Pod does not exist
          echo "Pod 'app-pod' does not exist in the 'configuration' namespace"
          exit 1
      fi

solution:
  explain: |
    Create ConfigMap, Secret, and Pod using them:

    ```bash
    # Create namespace
    kubectl create namespace configuration

    # Create ConfigMap
    kubectl create configmap app-config -n configuration \
      --from-literal=DB_HOST=mysql \
      --from-literal=DB_PORT=3306 \
      --from-literal=DB_NAME=myapp

    # Create Secret
    kubectl create secret generic app-secret -n configuration \
      --from-literal=DB_USER=admin \
      --from-literal=DB_PASSWORD=s3cr3t

    # Create Pod using ConfigMap and Secret
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Pod
    metadata:
      name: app-pod
      namespace: configuration
    spec:
      containers:
      - name: nginx
        image: nginx
        envFrom:
        - configMapRef:
            name: app-config
        volumeMounts:
        - name: secret-volume
          mountPath: /etc/app-secret
          readOnly: true
      volumes:
      - name: secret-volume
        secret:
          secretName: app-secret
    EOF
    ```
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
  run: |
    # Create namespace
    kubectl create namespace configuration

    # Create ConfigMap
    kubectl create configmap app-config -n configuration \
      --from-literal=DB_HOST=mysql \
      --from-literal=DB_PORT=3306 \
      --from-literal=DB_NAME=myapp

    # Create Secret
    kubectl create secret generic app-secret -n configuration \
      --from-literal=DB_USER=admin \
      --from-literal=DB_PASSWORD=s3cr3t

    # Create Pod using ConfigMap and Secret
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Pod
    metadata:
      name: app-pod
      namespace: configuration
    spec:
      containers:
      - name: nginx
        image: nginx
        envFrom:
        - configMapRef:
            name: app-config
        volumeMounts:
        - name: secret-volume
          mountPath: /etc/app-secret
          readOnly: true
      volumes:
      - name: secret-volume
        secret:
          secretName: app-secret
    EOF
