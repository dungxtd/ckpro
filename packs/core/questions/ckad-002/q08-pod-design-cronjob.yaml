    kind: CronJob
    metadata:
      name: backup-job
      namespace: pod-design
    spec:
      schedule: "*/5 * * * *"
      jobTemplate:
        spec:
          activeDeadlineSeconds: 100
          template:
            spec:
              containers:
              - name: backup
                image: busybox
                command: ['sh', '-c', 'echo Backup started: $(date); sleep 30; echo Backup completed: $(date)']
              restartPolicy: OnFailure
