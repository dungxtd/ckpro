# yaml-language-server: $schema=../../../schema/question.schema.json
title: Health Checks
certifications:
  ckad: application-observability-maintenance
difficulty: hard
namespace: health-checks
tags: [startup-probes, liveness-probes, readiness-probes]

statement: |
  Create a Pod named `health-check-pod` in the `health-checks` namespace with the following specifications:

  1. Use image `nginx`

  2. Configure startup probe:
     - HTTP GET on port 80
     - Initial delay: 10s
     - Period: 3s
     - Failure threshold: 3

  3. Configure liveness probe:
     - HTTP GET on port 80
     - Initial delay: 15s
     - Period: 5s
     - Failure threshold: 3

  4. Configure readiness probe:
     - HTTP GET on port 80
     - Initial delay: 5s
     - Period: 3s
     - Failure threshold: 3

  Ensure the namespace exists before creating the pod.

setup: |
  # Delete the health-checks namespace if it exists
  echo "Setting up environment for Question 16 (Health Checks)..."
  kubectl delete namespace health-checks --ignore-not-found=true

  # Wait for deletion to complete
  sleep 2

  # Confirm environment is ready
  echo "Environment ready for Question 16"
  exit 0

checks:
  - name: Namespace is created
    run: |
      # Validate that the health-checks namespace exists
      NS=$(kubectl get namespace health-checks -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$NS" == "health-checks" ]]; then
          # Namespace exists
          exit 0
      else
          # Namespace does not exist
          echo "Namespace 'health-checks' does not exist"
          exit 1
      fi
  - name: Pod is created with correct name and image
    run: |
      # Validate that the pod exists with correct name and image
      POD=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$POD" == "health-check-pod" ]]; then
          # Pod exists, now check image
          IMAGE=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].image}' 2>/dev/null)

          if [[ "$IMAGE" == "nginx" ]]; then
              # Pod has correct image
              exit 0
          else
              echo "Pod 'health-check-pod' does not use the correct image. Found: $IMAGE (expected: nginx)"
              exit 1
          fi
      else
          # Pod does not exist
          echo "Pod 'health-check-pod' does not exist in the 'health-checks' namespace"
          exit 1
      fi
  - name: Startup probe is configured correctly
    weight: 2
    run: |
      # Validate that the startup probe is configured correctly
      POD=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$POD" == "health-check-pod" ]]; then
          # Pod exists, now check if it has a startup probe
          # Check if it's using httpGet
          HTTP_GET=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].startupProbe.httpGet}' 2>/dev/null)

          # Check port
          PORT=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].startupProbe.httpGet.port}' 2>/dev/null)

          # Check initial delay
          INITIAL_DELAY=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].startupProbe.initialDelaySeconds}' 2>/dev/null)

          # Check period
          PERIOD=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].startupProbe.periodSeconds}' 2>/dev/null)

          # Check failure threshold
          FAILURE_THRESHOLD=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].startupProbe.failureThreshold}' 2>/dev/null)

          if [[ "$HTTP_GET" != "" &&
                "$PORT" == "80" &&
                "$INITIAL_DELAY" == "10" &&
                "$PERIOD" == "3" &&
                "$FAILURE_THRESHOLD" == "3" ]]; then
              # Startup probe is configured correctly
              exit 0
          else
              echo "Startup probe is not configured correctly."
              echo "Found port: $PORT (expected: 80)"
              echo "Found initial delay: $INITIAL_DELAY (expected: 10)"
              echo "Found period: $PERIOD (expected: 3)"
              echo "Found failure threshold: $FAILURE_THRESHOLD (expected: 3)"
              exit 1
          fi
      else
          # Pod does not exist
          echo "Pod 'health-check-pod' does not exist in the 'health-checks' namespace"
          exit 1
      fi
  - name: Liveness probe is configured correctly
    weight: 2
    run: |
      # Validate that the liveness probe is configured correctly
      POD=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$POD" == "health-check-pod" ]]; then
          # Pod exists, now check if it has a liveness probe
          # Check if it's using httpGet
          HTTP_GET=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].livenessProbe.httpGet}' 2>/dev/null)

          # Check port
          PORT=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].livenessProbe.httpGet.port}' 2>/dev/null)

          # Check initial delay
          INITIAL_DELAY=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].livenessProbe.initialDelaySeconds}' 2>/dev/null)

          # Check period
          PERIOD=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].livenessProbe.periodSeconds}' 2>/dev/null)

          # Check failure threshold
          FAILURE_THRESHOLD=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].livenessProbe.failureThreshold}' 2>/dev/null)

          if [[ "$HTTP_GET" != "" &&
                "$PORT" == "80" &&
                "$INITIAL_DELAY" == "15" &&
                "$PERIOD" == "5" &&
                "$FAILURE_THRESHOLD" == "3" ]]; then
              # Liveness probe is configured correctly
              exit 0
          else
              echo "Liveness probe is not configured correctly."
              echo "Found port: $PORT (expected: 80)"
              echo "Found initial delay: $INITIAL_DELAY (expected: 15)"
              echo "Found period: $PERIOD (expected: 5)"
              echo "Found failure threshold: $FAILURE_THRESHOLD (expected: 3)"
              exit 1
          fi
      else
          # Pod does not exist
          echo "Pod 'health-check-pod' does not exist in the 'health-checks' namespace"
          exit 1
      fi
  - name: Readiness probe is configured correctly
    weight: 2
    run: |
      # Validate that the readiness probe is configured correctly
      POD=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$POD" == "health-check-pod" ]]; then
          # Pod exists, now check if it has a readiness probe
          # Check if it's using httpGet
          HTTP_GET=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].readinessProbe.httpGet}' 2>/dev/null)

          # Check port
          PORT=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].readinessProbe.httpGet.port}' 2>/dev/null)

          # Check initial delay
          INITIAL_DELAY=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].readinessProbe.initialDelaySeconds}' 2>/dev/null)

          # Check period
          PERIOD=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].readinessProbe.periodSeconds}' 2>/dev/null)

          # Check failure threshold
          FAILURE_THRESHOLD=$(kubectl get pod health-check-pod -n health-checks -o jsonpath='{.spec.containers[0].readinessProbe.failureThreshold}' 2>/dev/null)

          if [[ "$HTTP_GET" != "" &&
                "$PORT" == "80" &&
                "$INITIAL_DELAY" == "5" &&
                "$PERIOD" == "3" &&
                "$FAILURE_THRESHOLD" == "3" ]]; then
              # Readiness probe is configured correctly
              exit 0
          else
              echo "Readiness probe is not configured correctly."
              echo "Found port: $PORT (expected: 80)"
              echo "Found initial delay: $INITIAL_DELAY (expected: 5)"
              echo "Found period: $PERIOD (expected: 3)"
              echo "Found failure threshold: $FAILURE_THRESHOLD (expected: 3)"
              exit 1
          fi
      else
          # Pod does not exist
          echo "Pod 'health-check-pod' does not exist in the 'health-checks' namespace"
          exit 1
      fi

solution:
  explain: |
    Create a Pod with multiple health probes:

    ```bash
    # Create namespace
    kubectl create namespace health-checks

    # Create Pod with startup, liveness, and readiness probes
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Namespace
    metadata:
      name: health-checks
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: health-check-pod
      namespace: health-checks
    spec:
      containers:
      - name: nginx
        image: nginx
        startupProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 3
    EOF
    ```
  run: |
    # Create namespace
    kubectl create namespace health-checks
    # A new namespace's default service account comes a moment later: a pod
    # created before it is refused
    until kubectl -n health-checks get serviceaccount default >/dev/null 2>&1; do sleep 1; done

    # Create Pod with startup, liveness, and readiness probes
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Namespace
    metadata:
      name: health-checks
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: health-check-pod
      namespace: health-checks
    spec:
      containers:
      - name: nginx
        image: nginx
        startupProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 3
    EOF
