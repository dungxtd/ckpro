# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X ckad-002 question 17
title: Pod Lifecycle
certifications:  # review: domains guessed from concepts
  ckad: application-design-build
difficulty: hard
namespace: pod-lifecycle
tags: [lifecycle-hooks, post-start, pre-stop, termination]

statement: |
  Create a Pod named `lifecycle-pod` in the `pod-lifecycle` namespace with the following specifications:

  1. Use image `nginx`
  2. Add postStart hook that creates a file `/usr/share/nginx/html/welcome.txt` with content `Welcome to the pod!`
  3. Add preStop hook that waits for `10` seconds
  4. Set termination grace period to `30` seconds

  Ensure the namespace exists before creating the pod.

setup: |
  # Delete the pod-lifecycle namespace if it exists
  echo "Setting up environment for Question 17 (Pod Lifecycle)..."
  kubectl delete namespace pod-lifecycle --ignore-not-found=true

  # Wait for deletion to complete
  sleep 2

  # Confirm environment is ready
  echo "Environment ready for Question 17"
  exit 0

checks:
  - name: Namespace is created
    run: |
      # Validate that the pod-lifecycle namespace exists
      NS=$(kubectl get namespace pod-lifecycle -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$NS" == "pod-lifecycle" ]]; then
          # Namespace exists
          exit 0
      else
          # Namespace does not exist
          echo "Namespace 'pod-lifecycle' does not exist"
          exit 1
      fi
  - name: Pod is created with correct name and image
    run: |
      # Validate that the pod exists with correct name and image
      POD=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$POD" == "lifecycle-pod" ]]; then
          # Pod exists, now check image
          IMAGE=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.spec.containers[0].image}' 2>/dev/null)

          if [[ "$IMAGE" == "nginx" ]]; then
              # Pod has correct image
              exit 0
          else
              echo "Pod 'lifecycle-pod' does not use the correct image. Found: $IMAGE (expected: nginx)"
              exit 1
          fi
      else
          # Pod does not exist
          echo "Pod 'lifecycle-pod' does not exist in the 'pod-lifecycle' namespace"
          exit 1
      fi
  - name: Post-start hook is configured correctly
    weight: 2
    run: |
      # Validate that the post-start hook is configured correctly
      POD=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$POD" == "lifecycle-pod" ]]; then
          # Pod exists, now check if it has a post-start hook
          # Check if it has exec post-start hook
          POST_START_EXEC=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.spec.containers[0].lifecycle.postStart.exec}' 2>/dev/null)

          if [[ "$POST_START_EXEC" != "" ]]; then
              # Has exec post-start hook, check command
              COMMAND=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.spec.containers[0].lifecycle.postStart.exec.command}' 2>/dev/null)

              if [[ "$COMMAND" == *"echo"* && "$COMMAND" == *"Welcome to the pod"* && "$COMMAND" == *"/usr/share/nginx/html/welcome.txt"* ]]; then
                  # Post-start hook creates the welcome file
                  exit 0
              else
                  echo "Post-start hook does not create the welcome file correctly."
                  echo "Found command: $COMMAND"
                  exit 1
              fi
          else
              # No exec post-start hook, check http post-start hook
              POST_START_HTTP=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.spec.containers[0].lifecycle.postStart.httpGet}' 2>/dev/null)

              if [[ "$POST_START_HTTP" != "" ]]; then
                  # Has http post-start hook
                  echo "Post-start hook uses httpGet instead of exec. Expected an exec hook that creates a welcome file."
                  exit 1
              else
                  echo "Pod 'lifecycle-pod' does not have a post-start hook"
                  exit 1
              fi
          fi
      else
          # Pod does not exist
          echo "Pod 'lifecycle-pod' does not exist in the 'pod-lifecycle' namespace"
          exit 1
      fi
  - name: Pre-stop hook is configured correctly
    weight: 2
    run: |
      # Validate that the pre-stop hook is configured correctly
      POD=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$POD" == "lifecycle-pod" ]]; then
          # Pod exists, now check if it has a pre-stop hook
          # Check if it has exec pre-stop hook
          PRE_STOP_EXEC=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.spec.containers[0].lifecycle.preStop.exec}' 2>/dev/null)

          if [[ "$PRE_STOP_EXEC" != "" ]]; then
              # Has exec pre-stop hook, check command
              COMMAND=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.spec.containers[0].lifecycle.preStop.exec.command}' 2>/dev/null)

              if [[ "$COMMAND" == *"sh"* && "$COMMAND" == *"-c"* && "$COMMAND" == *"sleep"* ]]; then
                  # Pre-stop hook has the sleep command, which is a common pattern
                  exit 0
              else
                  echo "Pre-stop hook does not have the expected command."
                  echo "Found command: $COMMAND"
                  echo "Expected a command containing 'sleep' to allow graceful shutdown."
                  exit 1
              fi
          else
              # No exec pre-stop hook, check http pre-stop hook
              PRE_STOP_HTTP=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.spec.containers[0].lifecycle.preStop.httpGet}' 2>/dev/null)

              if [[ "$PRE_STOP_HTTP" != "" ]]; then
                  # Has http pre-stop hook, this is acceptable as well
                  exit 0
              else
                  echo "Pod 'lifecycle-pod' does not have a pre-stop hook"
                  exit 1
              fi
          fi
      else
          # Pod does not exist
          echo "Pod 'lifecycle-pod' does not exist in the 'pod-lifecycle' namespace"
          exit 1
      fi
  - name: Termination grace period is set correctly
    run: |
      # Validate that the pod has the correct termination grace period
      POD=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.metadata.name}' 2>/dev/null)

      if [[ "$POD" == "lifecycle-pod" ]]; then
          # Pod exists, now check if it has a termination grace period
          GRACE_PERIOD=$(kubectl get pod lifecycle-pod -n pod-lifecycle -o jsonpath='{.spec.terminationGracePeriodSeconds}' 2>/dev/null)

          if [[ "$GRACE_PERIOD" == "30" ]]; then
              # Grace period is correctly set to 30 seconds
              exit 0
          elif [[ "$GRACE_PERIOD" == "" ]]; then
              echo "Pod 'lifecycle-pod' does not have a termination grace period specified (using default of 30 seconds)"
              exit 1
          else
              echo "Pod 'lifecycle-pod' has incorrect termination grace period. Found: $GRACE_PERIOD (expected: 45)"
              exit 1
          fi
      else
          # Pod does not exist
          echo "Pod 'lifecycle-pod' does not exist in the 'pod-lifecycle' namespace"
          exit 1
      fi

solution:
  explain: |
    Create a Pod with lifecycle hooks:

    ```bash
    # Create namespace
    kubectl create namespace pod-lifecycle

    # Create Pod with lifecycle hooks
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Namespace
    metadata:
      name: pod-lifecycle
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: lifecycle-pod
      namespace: pod-lifecycle
    spec:
      containers:
      - name: nginx
        image: nginx
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "echo 'Welcome to the pod!' > /usr/share/nginx/html/welcome.txt"]
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
    EOF
    ```
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
