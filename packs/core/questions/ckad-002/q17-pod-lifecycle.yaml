    kind: Namespace
    metadata:
      name: pod-lifecycle
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: lifecycle-pod
      namespace: pod-lifecycle
    spec:
      containers:
      - name: nginx
        image: nginx
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "echo 'Welcome to the pod!' > /usr/share/nginx/html/welcome.txt"]
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
    EOF
