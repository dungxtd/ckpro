# yaml-language-server: $schema=../../../schema/question.schema.json
title: Create a PersistentVolume named 'pv-storage' with 1Gi capacity, access mode ReadWriteOnce, hostPath type at /mnt/data, and reclaim policy Retain
certifications:
  ckad: application-environment-configuration-security
difficulty: medium
namespace: storage-test
tags: [persistent-volumes, storage, hostPath]

statement: |
  For this storage-related task, you need to provision persistent storage resources.

  Create a PersistentVolume named `pv-storage` with exactly `1Gi` capacity. Configure it with access mode `ReadWriteOnce` to allow read-write access by a single node.

  Use `hostPath` type pointing to the directory `/mnt/data` on the node.

  Set the reclaim policy to `Retain` so that the storage resource is not automatically deleted when the PV is released.

  This PV will be used by applications requiring persistent storage in the cluster.

setup: |
  # Setup for Question 2: Create a PersistentVolume named 'pv-storage'

  # Create the storage-test namespace if it doesn't exist already
  if ! kubectl get namespace storage-test &> /dev/null; then
      kubectl create namespace storage-test
  fi

  # Delete any existing PV with the same name to ensure a clean state
  kubectl delete pv pv-storage --ignore-not-found=true

  # Create the /mnt/data directory on the host if possible (this may require privileged access)
  # In a real environment, this would need to be handled by the cluster admin
  echo "Note: Ensure /mnt/data directory exists on the node for the hostPath volume"

  echo "Setup complete for Question 2: Environment ready for creating PersistentVolume 'pv-storage'"
  exit 0

checks:
  - name: PersistentVolume is created
    weight: 2
    run: |
      # Validate if the PersistentVolume 'pv-storage' exists
      if kubectl get pv pv-storage &> /dev/null; then
          echo "Success: PersistentVolume 'pv-storage' exists"
          exit 0
      else
          echo "Error: PersistentVolume 'pv-storage' does not exist"
          exit 1
      fi
  - name: PersistentVolume has correct capacity
    run: |
      # Validate if the PersistentVolume 'pv-storage' has the correct capacity (1Gi)
      CAPACITY=$(kubectl get pv pv-storage -o jsonpath='{.spec.capacity.storage}' 2>/dev/null)

      if [ "$CAPACITY" = "1Gi" ]; then
          echo "Success: PersistentVolume 'pv-storage' has the correct capacity (1Gi)"
          exit 0
      else
          echo "Error: PersistentVolume 'pv-storage' does not have the correct capacity. Found: '$CAPACITY', Expected: '1Gi'"
          exit 1
      fi
  - name: PersistentVolume has correct access mode
    run: |
      # Validate if the PersistentVolume 'pv-storage' has the correct access mode (ReadWriteOnce)
      ACCESS_MODE=$(kubectl get pv pv-storage -o jsonpath='{.spec.accessModes[0]}' 2>/dev/null)

      if [ "$ACCESS_MODE" = "ReadWriteOnce" ]; then
          echo "Success: PersistentVolume 'pv-storage' has the correct access mode (ReadWriteOnce)"
          exit 0
      else
          echo "Error: PersistentVolume 'pv-storage' does not have the correct access mode. Found: '$ACCESS_MODE', Expected: 'ReadWriteOnce'"
          exit 1
      fi
  - name: PersistentVolume has correct reclaim policy
    run: |
      # Validate if the PersistentVolume 'pv-storage' has the correct reclaim policy (Retain)
      RECLAIM_POLICY=$(kubectl get pv pv-storage -o jsonpath='{.spec.persistentVolumeReclaimPolicy}' 2>/dev/null)

      if [ "$RECLAIM_POLICY" = "Retain" ]; then
          echo "Success: PersistentVolume 'pv-storage' has the correct reclaim policy (Retain)"
          exit 0
      else
          echo "Error: PersistentVolume 'pv-storage' does not have the correct reclaim policy. Found: '$RECLAIM_POLICY', Expected: 'Retain'"
          exit 1
      fi

solution:
  explain: |
    ```yaml
    apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: pv-storage
    spec:
      capacity:
        storage: 1Gi
      accessModes:
        - ReadWriteOnce
      persistentVolumeReclaimPolicy: Retain
      hostPath:
        path: /mnt/data
    ```

    Save this as `pv-storage.yaml` and apply:

    ```bash
    kubectl apply -f pv-storage.yaml
    ```
  run: |
    cat > pv-storage.yaml <<'MANIFEST'
    apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: pv-storage
    spec:
      capacity:
        storage: 1Gi
      accessModes:
        - ReadWriteOnce
      persistentVolumeReclaimPolicy: Retain
      hostPath:
        path: /mnt/data
    MANIFEST

    kubectl apply -f pv-storage.yaml
