# yaml-language-server: $schema=../../../schema/question.schema.json
title: "Create a ClusterIP service named 'internal-app' in namespace 'networking' that routes traffic to pods with label 'app=backend' on port 8080, exposing the service on port 80"
certifications:
  ckad: services-networking
difficulty: medium
namespace: networking
tags: [services, clusterip, networking, selectors]

statement: |
  The microservices architecture requires internal service communication.

  Create a ClusterIP service named `internal-app` in namespace `networking` to enable this communication pattern.

  Configure the service to route traffic to pods with the label `app=backend`. The service should accept connections on port `80` and forward them to port `8080` on the backend pods.

  ClusterIP is the appropriate service type because this communication is entirely internal to the cluster and doesn`t need external exposure.

  Ensure the selector exactly matches the pod labels and the port configuration correctly maps the service port to the target port on the pods.

setup: |
  # Setup for Question 17: Create a ClusterIP service

  # Create the networking namespace if it doesn't exist already
  if ! kubectl get namespace networking &> /dev/null; then
      kubectl create namespace networking
  fi

  # Delete any existing service with the same name
  kubectl delete service internal-app -n networking --ignore-not-found=true

  # Create backend pods with the required labels
  kubectl delete deployment backend-app -n networking --ignore-not-found=true
  cat <<EOF | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: backend-app
    namespace: networking
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: backend
    template:
      metadata:
        labels:
          app: backend
      spec:
        containers:
        - name: backend
          image: nginx
          ports:
          - containerPort: 8080
          command: ["/bin/sh", "-c"]
          args: ["nginx -g 'daemon off;' & echo 'Backend service running on port 8080' && sleep infinity"]
  EOF

  echo "Setup complete for Question 17: Created backend pods with label app=backend for the ClusterIP service"
  exit 0

checks:
  - name: Service is created with correct type
    run: |
      # Validate if the Service 'internal-app' is of type ClusterIP in the 'networking' namespace
      SERVICE_TYPE=$(kubectl get service internal-app -n networking -o jsonpath='{.spec.type}' 2>/dev/null)

      if [ "$SERVICE_TYPE" = "ClusterIP" ]; then
          echo "Success: Service 'internal-app' is of correct type (ClusterIP)"
          exit 0
      else
          echo "Error: Service 'internal-app' is not of the correct type. Found: '$SERVICE_TYPE', Expected: 'ClusterIP'"
          exit 1
      fi
  - name: Service has correct selector
    weight: 2
    run: |
      # Validate that the 'internal-app' ClusterIP service has selector app=backend

      SERVICE_NAME="internal-app"
      NAMESPACE="networking"
      EXPECTED_KEY="app"
      EXPECTED_VALUE="backend"

      # Check if the service exists
      if ! kubectl get svc "$SERVICE_NAME" -n "$NAMESPACE" > /dev/null 2>&1; then
        echo "❌ Service '$SERVICE_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Fetch selector key and value
      ACTUAL_SELECTOR_VALUE=$(kubectl get svc "$SERVICE_NAME" -n "$NAMESPACE" -o jsonpath="{.spec.selector.$EXPECTED_KEY}")

      if [ "$ACTUAL_SELECTOR_VALUE" != "$EXPECTED_VALUE" ]; then
        echo "❌ Service selector mismatch"
        echo "Expected: $EXPECTED_KEY=$EXPECTED_VALUE"
        echo "Found: $EXPECTED_KEY=$ACTUAL_SELECTOR_VALUE"
        exit 1
      fi

      # Success
      echo "✅ Service '$SERVICE_NAME' in namespace '$NAMESPACE' has correct selector: $EXPECTED_KEY=$EXPECTED_VALUE"
      exit 0
  - name: Service has correct port configuration
    weight: 2
    run: |
      # Validate that 'internal-app' ClusterIP service routes port 80 -> targetPort 8080 using TCP

      SERVICE_NAME="internal-app"
      NAMESPACE="networking"
      EXPECTED_PORT=80
      EXPECTED_TARGET_PORT=8080
      EXPECTED_PROTOCOL="TCP"

      # Check if the service exists
      if ! kubectl get svc "$SERVICE_NAME" -n "$NAMESPACE" > /dev/null 2>&1; then
        echo "❌ Service '$SERVICE_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Get actual values
      ACTUAL_PORT=$(kubectl get svc "$SERVICE_NAME" -n "$NAMESPACE" -o jsonpath="{.spec.ports[0].port}")
      ACTUAL_TARGET_PORT=$(kubectl get svc "$SERVICE_NAME" -n "$NAMESPACE" -o jsonpath="{.spec.ports[0].targetPort}")
      ACTUAL_PROTOCOL=$(kubectl get svc "$SERVICE_NAME" -n "$NAMESPACE" -o jsonpath="{.spec.ports[0].protocol}")

      # Validate port
      if [ "$ACTUAL_PORT" != "$EXPECTED_PORT" ]; then
        echo "❌ Service port is $ACTUAL_PORT, expected $EXPECTED_PORT"
        exit 1
      fi

      # Validate targetPort
      if [ "$ACTUAL_TARGET_PORT" != "$EXPECTED_TARGET_PORT" ]; then
        echo "❌ Service targetPort is $ACTUAL_TARGET_PORT, expected $EXPECTED_TARGET_PORT"
        exit 1
      fi

      # Validate protocol
      if [ "$ACTUAL_PROTOCOL" != "$EXPECTED_PROTOCOL" ]; then
        echo "❌ Service protocol is $ACTUAL_PROTOCOL, expected $EXPECTED_PROTOCOL"
        exit 1
      fi

      # Success
      echo "✅ Service '$SERVICE_NAME' correctly maps port $EXPECTED_PORT to targetPort $EXPECTED_TARGET_PORT using $EXPECTED_PROTOCOL"
      exit 0

solution:
  explain: |
    Or using YAML:
    ```yaml
    apiVersion: v1
    kind: Service
    metadata:
      name: internal-app
      namespace: networking
    spec:
      type: ClusterIP
      selector:
        app: backend
      ports:
      - port: 80
        targetPort: 8080
        protocol: TCP
    ```

    Save as `internal-service.yaml` and apply:
    ```bash
    kubectl apply -f internal-service.yaml
    ```
  run: |
    cat > internal-service.yaml <<'MANIFEST'
    apiVersion: v1
    kind: Service
    metadata:
      name: internal-app
      namespace: networking
    spec:
      type: ClusterIP
      selector:
        app: backend
      ports:
      - port: 80
        targetPort: 8080
        protocol: TCP
    MANIFEST

    kubectl apply -f internal-service.yaml
