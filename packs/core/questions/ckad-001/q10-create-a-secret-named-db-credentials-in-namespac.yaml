# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X ckad-001 question 10
title: "Create a Secret named 'db-credentials' in namespace 'workloads' containing username=admin, random=true and password=securepass. Then create a Pod named 'secure-pod' using 'mysql:9.5.0' image with these credentials set as environment variables DB_USER, MYSQL_RANDOM_ROOT_PASSWORD and DB_PASSWORD"
certifications:  # review: domains guessed from concepts
  ckad: application-design-build
difficulty: medium
namespace: workloads
tags: [secrets, pods, environment-variables, mysql]

statement: |
  The database team needs to securely deploy a MySQL instance with proper credential management.

  Create a Secret named `db-credentials` in namespace `workloads` containing three sensitive values: `username=admin`, `random=true` and `password=securepass`.

  Then create a Pod named `secure-pod` using the `mysql:9.5.0` image that uses these credentials.

  Configure the pod to access the Secret values as environment variables named `DB_USER`, `MYSQL_RANDOM_ROOT_PASSWORD` and `DB_PASSWORD` respectively.

  This pattern demonstrates secure handling of sensitive information in Kubernetes without hardcoding credentials in the pod specification. Ensure the MySQL container is properly configured to use these environment variables for authentication.

setup: |
  # Setup for Question 10: Create a Secret and use it in a Pod

  # Create the workloads namespace if it doesn't exist already
  if ! kubectl get namespace workloads &> /dev/null; then
      kubectl create namespace workloads
  fi

  # Delete any existing Secret and Pod with the same names
  kubectl delete secret db-credentials -n workloads --ignore-not-found=true
  kubectl delete pod secure-pod -n workloads --ignore-not-found=true

  echo "Setup complete for Question 10: Environment ready for creating Secret 'db-credentials' and Pod 'secure-pod'"
  exit 0

checks:
  - name: Secret is created with correct data
    weight: 2
    run: |
      # Validate if the Secret 'db-credentials' exists in the 'workloads' namespace with correct data
      USERNAME=$(kubectl get secret db-credentials -n workloads -o jsonpath='{.data.username}' 2>/dev/null | base64 --decode)
      PASSWORD=$(kubectl get secret db-credentials -n workloads -o jsonpath='{.data.password}' 2>/dev/null | base64 --decode)
      RANDOM=$(kubectl get secret db-credentials -n workloads -o jsonpath='{.data.random}' 2>/dev/null | base64 --decode)

      if [ "$USERNAME" = "admin" ] && [ "$PASSWORD" = "securepass" ] && [ "$RANDOM" = "true" ]; then
          echo "Success: Secret 'db-credentials' exists with correct data"
          exit 0
      else
          echo "Error: Secret 'db-credentials' does not have the correct data."
          echo "Expected: username=admin, password=securepass, random=true"
          echo "Found: username=$USERNAME, password=$PASSWORD, random=$RANDOM"
          exit 1
      fi
  - name: Pod is created and running
    run: |
      # Validate if the pod 'logging-pod' is running in the 'troubleshooting' namespace
      POD_NAME="secure-pod"
      NAMESPACE="workloads"

      # Check if the pod is running
      POD_STATUS=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.status.phase}')

      if [ "$POD_STATUS" = "Running" ]; then
          echo "Success: Pod '$POD_NAME' is running in namespace '$NAMESPACE'"
          exit 0
      else
          echo "Error: Pod '$POD_NAME' is not running in namespace '$NAMESPACE'"
          exit 1
      fi
  - name: Pod has environment variables from Secret
    weight: 2
    run: |
      # Validate if the pod 'secure-pod' has the correct environment variables from Secret
      POD_NAME="secure-pod"
      NAMESPACE="workloads"

      # Expected secret name and keys
      EXPECTED_SECRET="db-credentials"
      EXPECTED_USER_KEY="username"
      EXPECTED_PASSWORD_KEY="password"
      EXPECTED_RANDOM_KEY="random"

      # Extract secret name and key used for DB_USER
      DB_USER_SECRET=$(kubectl get pod "$POD_NAME" -n "$NAMESPACE" -o jsonpath="{.spec.containers[0].env[?(@.name=='DB_USER')].valueFrom.secretKeyRef.name}")
      DB_USER_KEY=$(kubectl get pod "$POD_NAME" -n "$NAMESPACE" -o jsonpath="{.spec.containers[0].env[?(@.name=='DB_USER')].valueFrom.secretKeyRef.key}")

      # Extract secret name and key used for DB_PASSWORD
      DB_PASSWORD_SECRET=$(kubectl get pod "$POD_NAME" -n "$NAMESPACE" -o jsonpath="{.spec.containers[0].env[?(@.name=='DB_PASSWORD')].valueFrom.secretKeyRef.name}")
      DB_PASSWORD_KEY=$(kubectl get pod "$POD_NAME" -n "$NAMESPACE" -o jsonpath="{.spec.containers[0].env[?(@.name=='DB_PASSWORD')].valueFrom.secretKeyRef.key}")

      # Extract secret name and key used for MYSQL_RANDOM_ROOT_PASSWORD
      MYSQL_RANDOM_ROOT_PASSWORD_SECRET=$(kubectl get pod "$POD_NAME" -n "$NAMESPACE" -o jsonpath="{.spec.containers[0].env[?(@.name=='MYSQL_RANDOM_ROOT_PASSWORD')].valueFrom.secretKeyRef.name}")
      MYSQL_RANDOM_ROOT_PASSWORD_KEY=$(kubectl get pod "$POD_NAME" -n "$NAMESPACE" -o jsonpath="{.spec.containers[0].env[?(@.name=='MYSQL_RANDOM_ROOT_PASSWORD')].valueFrom.secretKeyRef.key}")

      # Validate all
      if [[ "$DB_USER_SECRET" == "$EXPECTED_SECRET" && "$DB_USER_KEY" == "$EXPECTED_USER_KEY" &&
            "$DB_PASSWORD_SECRET" == "$EXPECTED_SECRET" && "$DB_PASSWORD_KEY" == "$EXPECTED_PASSWORD_KEY" &&
            "$MYSQL_RANDOM_ROOT_PASSWORD_SECRET" == "$EXPECTED_SECRET" && "$MYSQL_RANDOM_ROOT_PASSWORD_KEY" == "$EXPECTED_RANDOM_KEY" ]]; then
          echo "✅ Success: Pod '$POD_NAME' has correct secret name and keys for env variables"
          exit 0
      else
          echo "❌ Error: Pod '$POD_NAME' does not have the correct secret configuration"
          echo "DB_USER -> Secret: $DB_USER_SECRET, Key: $DB_USER_KEY"
          echo "DB_PASSWORD -> Secret: $DB_PASSWORD_SECRET, Key: $DB_PASSWORD_KEY"
          exit 1
      fi

solution:
  explain: |
    ```bash
    # Create the Secret
    kubectl create secret generic db-credentials -n workloads --from-literal=username=admin --from-literal=password=securepass --from-literal=random=true
    ```

    Create the Pod with Secret environment variables:
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: secure-pod
      namespace: workloads
    spec:
      containers:
      - name: mysql
        image: mysql:9.5.0
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        - name: MYSQL_RANDOM_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: random
      restartPolicy: Always
    ```

    Save as `secure-pod.yaml` and apply:
    ```bash
    kubectl apply -f secure-pod.yaml
    ```
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
  run: |
    # Create the Secret
    kubectl create secret generic db-credentials -n workloads --from-literal=username=admin --from-literal=password=securepass --from-literal=random=true
    kubectl apply -f secure-pod.yaml
