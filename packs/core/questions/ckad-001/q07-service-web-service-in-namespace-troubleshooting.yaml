# yaml-language-server: $schema=../../../schema/question.schema.json
title: Service 'web-service' in namespace 'troubleshooting' is not routing traffic to pods properly. Identify and fix the issue
certifications:
  ckad: application-observability-maintenance
difficulty: medium
namespace: troubleshooting
tags: [services, selectors, networking, troubleshooting]

statement: |
  Users are reporting connectivity issues with an application.

  The Service `web-service` in namespace `troubleshooting` is supposed to route traffic to backend pods, but it is not functioning correctly.

  Investigate this service and identify what is preventing proper traffic routing. Possible issues could include:

  - Mismatched selectors between service and pods
  - Incorrect port configurations
  - Problems with the underlying pods

  After identifying the issue, implement the necessary fixes to ensure the service correctly routes traffic to the appropriate pods.

  Verify your fix by ensuring that service endpoints are properly populated and traffic is forwarded as expected.

setup: |
  # Setup for Question 7: Service with incorrect selector not routing traffic to pods

  # Create the troubleshooting namespace if it doesn't exist already
  if ! kubectl get namespace troubleshooting &> /dev/null; then
      kubectl create namespace troubleshooting
  fi

  # Delete any existing resources with the same names
  kubectl delete service web-service -n troubleshooting --ignore-not-found=true
  kubectl delete deployment web-app -n troubleshooting --ignore-not-found=true

  # Create a deployment with label app=web-app
  cat <<EOF | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: web-app
    namespace: troubleshooting
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: web-app
    template:
      metadata:
        labels:
          app: web-app
      spec:
        containers:
        - name: nginx
          image: nginx
          ports:
          - containerPort: 80
  EOF

  # Create a service with incorrect selector (app=web instead of app=web-app)
  cat <<EOF | kubectl apply -f -
  apiVersion: v1
  kind: Service
  metadata:
    name: web-service
    namespace: troubleshooting
  spec:
    selector:
      app: web  # Incorrect selector, should be app=web-app
    ports:
    - port: 80
      targetPort: 3030
  EOF

  echo "Setup complete for Question 7: Created service 'web-service' with incorrect selector"
  exit 0

checks:
  - name: Service selector matches pod labels
    weight: 3
    run: |
      # Validate that the service 'web-service' has selectors that match pod labels in namespace 'troubleshooting'

      NAMESPACE="troubleshooting"
      SERVICE_NAME="web-service"

      # Get service selector
      SERVICE_SELECTOR=$(kubectl get service $SERVICE_NAME -n $NAMESPACE -o jsonpath='{.spec.selector}' 2>/dev/null)

      if [ -z "$SERVICE_SELECTOR" ]; then
        echo "❌ Service '$SERVICE_NAME' not found in namespace '$NAMESPACE' or selector is not defined"
        exit 1
      fi

      # Get selector in key=value format for matching against pod labels
      SELECTOR_STRING=""
      for key in $(echo $SERVICE_SELECTOR | jq -r 'keys[]'); do
        value=$(echo $SERVICE_SELECTOR | jq -r --arg key "$key" '.[$key]')
        if [ -n "$SELECTOR_STRING" ]; then
          SELECTOR_STRING="$SELECTOR_STRING,"
        fi
        SELECTOR_STRING="${SELECTOR_STRING}${key}=${value}"
      done

      # Check if pods exist with matching labels
      MATCHING_PODS=$(kubectl get pods -n $NAMESPACE -l "$SELECTOR_STRING" -o name 2>/dev/null)

      if [ -z "$MATCHING_PODS" ]; then
        echo "❌ No pods found with labels matching service selector: $SELECTOR_STRING"
        exit 1
      fi

      # Count endpoints for service
      ENDPOINTS=$(kubectl get endpoints $SERVICE_NAME -n $NAMESPACE -o jsonpath='{.subsets[*].addresses}' 2>/dev/null)

      if [ -z "$ENDPOINTS" ] || [ "$ENDPOINTS" == "[]" ]; then
        echo "❌ Service '$SERVICE_NAME' has no endpoints"
        exit 1
      fi

      echo "✅ Service '$SERVICE_NAME' selector '$SELECTOR_STRING' matches pod labels and has endpoints"
      exit 0
  - name: Service ports match container ports
    weight: 2
    run: |
      # Validate that the service ports match container ports for 'web-service' in namespace 'troubleshooting'

      NAMESPACE="troubleshooting"
      SERVICE_NAME="web-service"

      # Get service selector and port
      SERVICE_SELECTOR=$(kubectl get service $SERVICE_NAME -n $NAMESPACE -o jsonpath='{.spec.selector}' 2>/dev/null)
      SERVICE_PORT=$(kubectl get service $SERVICE_NAME -n $NAMESPACE -o jsonpath='{.spec.ports[0].port}' 2>/dev/null)
      TARGET_PORT=$(kubectl get service $SERVICE_NAME -n $NAMESPACE -o jsonpath='{.spec.ports[0].targetPort}' 2>/dev/null)

      if [ -z "$SERVICE_SELECTOR" ] || [ -z "$SERVICE_PORT" ] || [ -z "$TARGET_PORT" ]; then
        echo "❌ Service '$SERVICE_NAME' not found in namespace '$NAMESPACE' or port configuration is incomplete"
        exit 1
      fi

      # Format selector for kubectl label selector
      SELECTOR_STRING=""
      for key in $(echo $SERVICE_SELECTOR | jq -r 'keys[]'); do
        value=$(echo $SERVICE_SELECTOR | jq -r --arg key "$key" '.[$key]')
        if [ -n "$SELECTOR_STRING" ]; then
          SELECTOR_STRING="$SELECTOR_STRING,"
        fi
        SELECTOR_STRING="${SELECTOR_STRING}${key}=${value}"
      done

      # Get the container port from the pods matching the service selector
      PODS=$(kubectl get pods -n $NAMESPACE -l "$SELECTOR_STRING" -o name 2>/dev/null)

      if [ -z "$PODS" ]; then
        echo "❌ No pods found matching the service selector"
        exit 1
      fi

      CONTAINER_PORT_FOUND=false

      for POD in $PODS; do
        POD_NAME=$(echo "$POD" | cut -d '/' -f 2)
        CONTAINER_PORTS=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.containers[*].ports[*].containerPort}' 2>/dev/null)

        if [[ $CONTAINER_PORTS == *"$TARGET_PORT"* ]]; then
          CONTAINER_PORT_FOUND=true
          break
        fi
      done

      if [ "$CONTAINER_PORT_FOUND" = false ]; then
        echo "❌ No container found with port $TARGET_PORT matching service target port"
        exit 1
      fi

      echo "✅ Service '$SERVICE_NAME' ports correctly match container ports (service port: $SERVICE_PORT, target port: $TARGET_PORT)"
      exit 0

solution:
  explain: |
    Troubleshooting steps:
    ```bash
    # Check the service configuration
    kubectl get svc web-service -n troubleshooting

    # Examine the service details to identify selector and port configuration issues
    kubectl describe svc web-service -n troubleshooting

    ```

    Solution approach based on typical issues:

    1. If the service selector doesn't match any pod labels, fix the service selector:
    ```yaml
    apiVersion: v1
    kind: Service
    metadata:
      name: web-service
      namespace: troubleshooting
    spec:
      selector:
        app: web-app
      ports:
      - port: 80
        targetPort: 80
    ```

    2. Save as `fixed-service.yaml` and apply:
    ```bash
    kubectl apply -f fixed-service.yaml
    ```
  run: |
    # Check the service configuration
    kubectl get svc web-service -n troubleshooting

    # Examine the service details to identify selector and port configuration issues
    kubectl describe svc web-service -n troubleshooting

    cat > fixed-service.yaml <<'MANIFEST'
    apiVersion: v1
    kind: Service
    metadata:
      name: web-service
      namespace: troubleshooting
    spec:
      selector:
        app: web-app
      ports:
      - port: 80
        targetPort: 80
    MANIFEST

    kubectl apply -f fixed-service.yaml
