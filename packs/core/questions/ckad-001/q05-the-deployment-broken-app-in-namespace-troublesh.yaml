# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X ckad-001 question 5
title: The deployment 'broken-app' in namespace 'troubleshooting' is failing to start. Identify and fix the issue
certifications:  # review: domains guessed from concepts
  ckad: application-observability-maintenance
difficulty: medium
namespace: troubleshooting
tags: [deployments, troubleshooting, debugging]

statement: |
  The development team has reported an issue with their application deployment.

  The deployment `broken-app` in namespace `troubleshooting` is consistently failing to start and maintain running pods.

  Your task is to investigate this deployment, identify the root cause of the failure, and implement the necessary fixes to make the deployment operational.

  Check for issues such as incorrect container image references, resource constraints, configuration problems, or any other factors preventing successful deployment.

  Document your findings and the changes you make to fix the issue.

setup: |
  # Setup for Question 5: Troubleshoot and fix a broken deployment

  # Create the troubleshooting namespace if it doesn't exist already
  if ! kubectl get namespace troubleshooting &> /dev/null; then
      kubectl create namespace troubleshooting
  fi

  # Delete any existing deployment with the same name
  kubectl delete deployment broken-app -n troubleshooting --ignore-not-found=true

  # Create a broken deployment with an invalid image name
  cat <<EOF | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: broken-app
    namespace: troubleshooting
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: broken-app
    template:
      metadata:
        labels:
          app: broken-app
      spec:
        containers:
        - name: app
          image: nginx:nonexistentversion  # This image tag doesn't exist
          ports:
          - containerPort: 80
  EOF

  echo "Setup complete for Question 5: Created broken deployment 'broken-app' in namespace 'troubleshooting'"
  exit 0

checks:
  - name: Deployment pods are running
    weight: 3
    run: |
      # Validate if the pods of deployment 'broken-app' are running in the 'troubleshooting' namespace
      READY_PODS=$(kubectl get deployment broken-app -n troubleshooting -o jsonpath='{.status.readyReplicas}' 2>/dev/null)
      TOTAL_PODS=$(kubectl get deployment broken-app -n troubleshooting -o jsonpath='{.status.replicas}' 2>/dev/null)

      if [ -z "$READY_PODS" ]; then
          READY_PODS=0
      fi

      if [ -z "$TOTAL_PODS" ]; then
          echo "Error: Deployment 'broken-app' does not exist in namespace 'troubleshooting'"
          exit 1
      fi

      if [ "$READY_PODS" -eq "$TOTAL_PODS" ] && [ "$READY_PODS" -gt 0 ]; then
          echo "Success: All pods in deployment 'broken-app' are running ($READY_PODS/$TOTAL_PODS)"
          exit 0
      else
          echo "Error: Not all pods in deployment 'broken-app' are running ($READY_PODS/$TOTAL_PODS)"
          exit 1
      fi
  - name: Deployment has correct container image
    weight: 2
    run: |
      # validate the container image is correct having image name nginx
      # Validate if the pods of deployment 'broken-app' are running in the 'troubleshooting' namespace
      #check deployment status is runing or not
      DEPLOYMENT_STATUS=$(kubectl get deployment broken-app -n troubleshooting -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')
      if [ "$DEPLOYMENT_STATUS" != "True" ]; then
          echo "Error: The deployment 'broken-app' is not running"
          exit 1
      fi

      IMAGE=$(kubectl get deployment broken-app -n troubleshooting -o jsonpath='{.spec.template.spec.containers[0].image}' | cut -d':' -f1)

      if [ "$IMAGE" == "nginx" ]; then
          echo "Success: The container image is correct"
          exit 0
      else
          echo "Error: The container image is not correct"
          exit 1
      fi

solution:
  explain: |
    Troubleshooting steps:
    ```bash
    # Check the pods in the troubleshooting namespace
    kubectl get pods -n troubleshooting

    # Check the pod details for errors
    kubectl describe pod -l app=broken-app -n troubleshooting

    # Check logs of the failing pod
    kubectl logs <pod-name> -n troubleshooting
    ```

    Potential fixes:
    1. If the image is incorrect:
       ```bash
       kubectl set image deployments -n troubleshooting broken-app app=nginx:latest
       ```
    2. If environment variables are missing:
       ```bash
       kubectl edit deployment broken-app -n troubleshooting
       ```
    3. If resource limits are too low:
       ```bash
       kubectl patch deployment broken-app -n troubleshooting -p '{"spec":{"template":{"spec":{"containers":[{"name":"container-name","resources":{"limits":{"memory":"512Mi"}}}]}}}}'
       ```
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
  run: |
    # Check the pods in the troubleshooting namespace
    kubectl get pods -n troubleshooting

    # Check the pod details for errors
    kubectl describe pod -l app=broken-app -n troubleshooting

    # Check logs of the failing pod
    kubectl logs <pod-name> -n troubleshooting

