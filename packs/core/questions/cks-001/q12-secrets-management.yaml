# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X cks-001 question 12
title: Secrets Management
certifications:  # review: domains guessed from concepts
  cks: supply-chain-security
difficulty: hard
namespace: secrets-management
tags: [secrets, volume mounts, environment variables]

statement: |
  Create a Secret named `db-creds` in the `secrets-management` namespace with the following data:
  - username: `admin`
  - password: `SecretP@ssw0rd`

  Deploy a pod named `secure-app` that mounts this secret as files at `/etc/db-creds`.

  Additionally, deploy a second pod named `env-app` that exposes the secret data as environment variables with names `DB_USER` and `DB_PASS`.

  Both pods should use the `busybox` image and run the command `sleep 3600`.

setup: |
  # Setup for Question 12: Secrets Management

  # Create namespace if it doesn't exist
  kubectl create namespace secrets-management 2>/dev/null || true

  # Create a ConfigMap with information about Kubernetes secrets
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: secrets-info
    namespace: secrets-management
  data:
    secrets-best-practices.txt: |
      Kubernetes Secrets Best Practices:

      1. Avoid using secrets in environment variables
      2. Mount secrets as volumes when possible
      3. Use external secret stores (e.g., Vault) for production
      4. Encrypt etcd data
      5. Use RBAC to restrict access to secrets
      6. Consider using 3rd party tools like Sealed Secrets
      7. Rotate secrets regularly
      8. Avoid storing secrets in container images
  EOF

  # Create a sample pod to demonstrate incorrect secret handling
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: Pod
  metadata:
    name: insecure-app
    namespace: secrets-management
  spec:
    containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
      env:
      - name: DB_PASSWORD
        value: "plaintext-password-in-env"
  EOF

  echo "Setup completed for Question 12"
  exit 0

checks:
  - name: Secret exists with correct data
    run: |
      # Validate that secret exists with correct data

      SECRET_NAME="db-creds"
      NAMESPACE="secrets-management"
      EXPECTED_USERNAME="admin"
      EXPECTED_PASSWORD="SecretP@ssw0rd"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check if secret exists
      kubectl get secret $SECRET_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Secret '$SECRET_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if secret has username and password keys
      USERNAME=$(kubectl get secret $SECRET_NAME -n $NAMESPACE -o jsonpath='{.data.username}' | base64 --decode)
      PASSWORD=$(kubectl get secret $SECRET_NAME -n $NAMESPACE -o jsonpath='{.data.password}' | base64 --decode)

      if [ -z "$USERNAME" ]; then
        echo "❌ Secret doesn't have 'username' key"
        exit 1
      fi

      if [ -z "$PASSWORD" ]; then
        echo "❌ Secret doesn't have 'password' key"
        exit 1
      fi

      # Check if values are correct
      if [ "$USERNAME" != "$EXPECTED_USERNAME" ]; then
        echo "❌ Secret has incorrect username. Expected: $EXPECTED_USERNAME"
        exit 1
      fi

      if [ "$PASSWORD" != "$EXPECTED_PASSWORD" ]; then
        echo "❌ Secret has incorrect password. Expected: $EXPECTED_PASSWORD"
        exit 1
      fi

      echo "✅ Secret exists with correct data"
      exit 0
  - name: First pod mounts secrets as files
    weight: 2
    run: |
      # Validate that pod mounts secrets as files

      POD_NAME="secure-app"
      NAMESPACE="secrets-management"
      SECRET_NAME="db-creds"
      MOUNT_PATH="/etc/db-creds"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check if pod exists
      kubectl get pod $POD_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Pod '$POD_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if pod has volume for secret
      SECRET_VOLUME=$(kubectl get pod $POD_NAME -n $NAMESPACE -o json | grep -c "$SECRET_NAME")
      if [ "$SECRET_VOLUME" -eq 0 ]; then
        echo "❌ Pod doesn't have volume for secret '$SECRET_NAME'"
        exit 1
      fi

      # Check if volume is mounted at correct path
      VOLUME_MOUNT=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.containers[0].volumeMounts[*].mountPath}')
      if [[ "$VOLUME_MOUNT" != *"$MOUNT_PATH"* ]]; then
        echo "❌ Secret not mounted at correct path. Expected: $MOUNT_PATH"
        exit 1
      fi

      # Verify that files exist in the container
      if ! kubectl exec $POD_NAME -n $NAMESPACE -- ls $MOUNT_PATH/username &> /dev/null; then
        echo "❌ Username file not found in container at $MOUNT_PATH/username"
        exit 1
      fi

      if ! kubectl exec $POD_NAME -n $NAMESPACE -- ls $MOUNT_PATH/password &> /dev/null; then
        echo "❌ Password file not found in container at $MOUNT_PATH/password"
        exit 1
      fi

      echo "✅ Pod mounts secrets as files"
      exit 0
  - name: Second pod has secrets as environment variables
    weight: 2
    run: |
      # Validate that pod has secrets as environment variables

      POD_NAME="env-app"
      NAMESPACE="secrets-management"
      SECRET_NAME="db-creds"
      ENV_USER="DB_USER"
      ENV_PASS="DB_PASS"
      EXPECTED_USERNAME="admin"
      EXPECTED_PASSWORD="SecretP@ssw0rd"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check if pod exists
      kubectl get pod $POD_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Pod '$POD_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if pod has environment variables referencing the secret
      ENV_REFS=$(kubectl get pod $POD_NAME -n $NAMESPACE -o json | grep -c "$SECRET_NAME")
      if [ "$ENV_REFS" -eq 0 ]; then
        echo "❌ Pod doesn't reference secret '$SECRET_NAME' in environment variables"
        exit 1
      fi

      # Check if pod has the expected environment variable names
      POD_ENV_VARS=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.containers[0].env[*].name}')
      if [[ "$POD_ENV_VARS" != *"$ENV_USER"* ]]; then
        echo "❌ Pod doesn't have environment variable $ENV_USER"
        exit 1
      fi

      if [[ "$POD_ENV_VARS" != *"$ENV_PASS"* ]]; then
        echo "❌ Pod doesn't have environment variable $ENV_PASS"
        exit 1
      fi

      # Verify env vars in the container
      USERNAME=$(kubectl exec $POD_NAME -n $NAMESPACE -- env | grep $ENV_USER | cut -d '=' -f 2)
      PASSWORD=$(kubectl exec $POD_NAME -n $NAMESPACE -- env | grep $ENV_PASS | cut -d '=' -f 2)

      if [ "$USERNAME" != "$EXPECTED_USERNAME" ]; then
        echo "❌ Environment variable $ENV_USER doesn't have the expected value"
        exit 1
      fi

      if [ "$PASSWORD" != "$EXPECTED_PASSWORD" ]; then
        echo "❌ Environment variable $ENV_PASS doesn't have the expected value"
        exit 1
      fi

      echo "✅ Pod has secrets as environment variables"
      exit 0

solution:
  explain: |
    Create and use secrets:

    ```yaml
    apiVersion: v1
    kind: Secret
    metadata:
      name: db-creds
      namespace: secrets-management
    type: Opaque
    data:
      username: YWRtaW4=  # base64 encoded 'admin'
      password: U2VjcmV0UEBzc3cwcmQ=  # base64 encoded 'SecretP@ssw0rd'
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: secure-app
      namespace: secrets-management
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sleep", "3600"]
        volumeMounts:
        - name: secret-volume
          mountPath: /etc/db-creds
          readOnly: true
      volumes:
      - name: secret-volume
        secret:
          secretName: db-creds
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: env-app
      namespace: secrets-management
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sleep", "3600"]
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: password
    ```
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
  run: |
    kubectl apply -f - <<'MANIFEST'
    apiVersion: v1
    kind: Secret
    metadata:
      name: db-creds
      namespace: secrets-management
    type: Opaque
    data:
      username: YWRtaW4=  # base64 encoded 'admin'
      password: U2VjcmV0UEBzc3cwcmQ=  # base64 encoded 'SecretP@ssw0rd'
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: secure-app
      namespace: secrets-management
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sleep", "3600"]
        volumeMounts:
        - name: secret-volume
          mountPath: /etc/db-creds
          readOnly: true
      volumes:
      - name: secret-volume
        secret:
          secretName: db-creds
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: env-app
      namespace: secrets-management
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sleep", "3600"]
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: password
    MANIFEST
