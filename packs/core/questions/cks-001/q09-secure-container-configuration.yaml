# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X cks-001 question 9
title: Secure Container Configuration
certifications:  # review: domains guessed from concepts
  cks: supply-chain-security
difficulty: hard
namespace: os-hardening
tags: [capabilities, read-only filesystem, user context]

statement: |
  Create a pod named `secure-container` in the `os-hardening` namespace using the `nginx` image with the following security settings:

  1. The container should drop ALL capabilities and only add back the `NET_BIND_SERVICE` capability
  2. The container should use a read-only root filesystem
  3. The container should run as user ID 1000 and group ID 3000

  Ensure the container can start successfully and serve traffic on port 80.

setup: |
  # Setup for Question 9: Secure Container Configuration

  # Create namespace if it doesn't exist
  kubectl create namespace os-hardening 2>/dev/null || true

  # Create a reference pod with standard configuration
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: Pod
  metadata:
    name: default-nginx
    namespace: os-hardening
  spec:
    containers:
    - name: nginx
      image: nginx
  EOF

  # Create a ConfigMap with information about Linux capabilities
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: capabilities-info
    namespace: os-hardening
  data:
    capabilities.txt: |
      NET_BIND_SERVICE - Allows a process to bind to a port below 1024
      CHOWN - Make arbitrary changes to file UIDs and GIDs
      DAC_OVERRIDE - Bypass file read, write, and execute permission checks
      FOWNER - Bypass permission checks on operations that normally require the file system UID
      FSETID - Don't clear set-user-ID and set-group-ID mode bits when a file is modified
      KILL - Bypass permission checks for sending signals
      SETGID - Make arbitrary manipulations of process GIDs
      SETUID - Make arbitrary manipulations of process UIDs
      SETPCAP - Modify process capabilities
      SYS_CHROOT - Use chroot()
  EOF

  echo "Setup completed for Question 9"
  exit 0

checks:
  - name: Pod exists
    run: |
      # Validate that pod exists

      POD_NAME="secure-container"
      NAMESPACE="os-hardening"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check if pod exists
      kubectl get pod $POD_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Pod '$POD_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if pod is running
      POD_STATUS=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.status.phase}')
      if [ "$POD_STATUS" != "Running" ]; then
        echo "❌ Pod '$POD_NAME' is not in Running state (current state: $POD_STATUS)"
        exit 1
      fi

      echo "✅ Pod '$POD_NAME' exists and is running in namespace '$NAMESPACE'"
      exit 0
  - name: Pod has correct capabilities configuration
    weight: 2
    run: |
      # Validate that the pod has correct capabilities configuration

      POD_NAME="secure-container"
      NAMESPACE="os-hardening"
      REQUIRED_DROP_CAPS=("ALL")
      REQUIRED_ADD_CAPS=("NET_BIND_SERVICE")

      # Check if pod exists
      kubectl get pod $POD_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Pod '$POD_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if the pod has dropped ALL capabilities
      DROP_CAPS=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.containers[0].securityContext.capabilities.drop}')
      for cap in "${REQUIRED_DROP_CAPS[@]}"; do
        if [[ "$DROP_CAPS" != *"$cap"* ]]; then
          echo "❌ Pod has not dropped required capability: $cap"
          exit 1
        fi
      done

      # Check if the pod has added the required capabilities
      ADD_CAPS=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.containers[0].securityContext.capabilities.add}')
      for cap in "${REQUIRED_ADD_CAPS[@]}"; do
        if [[ "$ADD_CAPS" != *"$cap"* ]]; then
          echo "❌ Pod has not added required capability: $cap"
          exit 1
        fi
      done

      echo "✅ Pod has correct capabilities configuration (dropped ALL, added NET_BIND_SERVICE)"
      exit 0
  - name: Pod uses read-only root filesystem
    run: |
      # Validate that the pod uses a read-only root filesystem

      POD_NAME="secure-container"
      NAMESPACE="os-hardening"

      # Check if pod exists
      kubectl get pod $POD_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Pod '$POD_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if readOnlyRootFilesystem is set to true
      READONLY_ROOT=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}')
      if [ "$READONLY_ROOT" != "true" ]; then
        echo "❌ Pod does not have readOnlyRootFilesystem set to true"
        exit 1
      fi

      # Check for required volume mounts for nginx to function with read-only filesystem
      VOLUME_MOUNTS=$(kubectl get pod $POD_NAME -n $NAMESPACE -o json | jq -r '.spec.containers[0].volumeMounts[].mountPath')
      if ! echo "$VOLUME_MOUNTS" | grep -q "/tmp"; then
        echo "❌ Pod is missing required volume mount for /tmp"
        exit 1
      fi

      if ! echo "$VOLUME_MOUNTS" | grep -q "/var/cache/nginx"; then
        echo "❌ Pod is missing required volume mount for /var/cache/nginx"
        exit 1
      fi

      if ! echo "$VOLUME_MOUNTS" | grep -q "/var/run"; then
        echo "❌ Pod is missing required volume mount for /var/run"
        exit 1
      fi

      echo "✅ Pod uses a read-only root filesystem with appropriate volume mounts"
      exit 0
  - name: Pod runs as correct user/group
    run: |
      # Validate that the pod runs as the correct user and group

      POD_NAME="secure-container"
      NAMESPACE="os-hardening"
      REQUIRED_USER_ID=1000
      REQUIRED_GROUP_ID=3000

      # Check if pod exists
      kubectl get pod $POD_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Pod '$POD_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if pod runs as the correct user
      RUN_AS_USER=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.containers[0].securityContext.runAsUser}')
      if [ "$RUN_AS_USER" != "$REQUIRED_USER_ID" ]; then
        echo "❌ Pod does not run as user ID $REQUIRED_USER_ID (actual: $RUN_AS_USER)"
        exit 1
      fi

      # Check if pod runs as the correct group
      RUN_AS_GROUP=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.containers[0].securityContext.runAsGroup}')
      if [ "$RUN_AS_GROUP" != "$REQUIRED_GROUP_ID" ]; then
        echo "❌ Pod does not run as group ID $REQUIRED_GROUP_ID (actual: $RUN_AS_GROUP)"
        exit 1
      fi

      echo "✅ Pod runs as user ID $REQUIRED_USER_ID and group ID $REQUIRED_GROUP_ID"
      exit 0

solution:
  explain: |
    Create a pod with minimal security context:

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: secure-container
      namespace: os-hardening
    spec:
      containers:
      - name: nginx
        image: nginx
        securityContext:
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 3000
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-cache-nginx
          mountPath: /var/cache/nginx
        - name: var-run
          mountPath: /var/run
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-cache-nginx
        emptyDir: {}
      - name: var-run
        emptyDir: {}
    ```
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
  run: |
    kubectl apply -f - <<'MANIFEST'
    apiVersion: v1
    kind: Pod
    metadata:
      name: secure-container
      namespace: os-hardening
    spec:
      containers:
      - name: nginx
        image: nginx
        securityContext:
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 3000
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-cache-nginx
          mountPath: /var/cache/nginx
        - name: var-run
          mountPath: /var/run
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-cache-nginx
        emptyDir: {}
      - name: var-run
        emptyDir: {}
    MANIFEST
