checks:
  - name: Ingress exists
    run: |
      # Validate that the Ingress exists

      INGRESS_NAME="secure-app"
      NAMESPACE="secure-ingress"

      kubectl get ingress $INGRESS_NAME -n $NAMESPACE &> /dev/null
      if [ $? -eq 0 ]; then
        echo "✅ Success: Ingress exists"
        exit 0
      else
        echo "❌ Failure: Ingress not found"
        exit 1
      fi
  - name: Ingress configured with correct hostname
    run: |
      # Validate that the Ingress has correct hostname configuration

      INGRESS_NAME="secure-app"
      NAMESPACE="secure-ingress"
      EXPECTED_HOSTNAME="secure-app.example.com"

      # Check if ingress exists
      kubectl get ingress $INGRESS_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Ingress '$INGRESS_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check for correct hostname
      HOSTNAME=$(kubectl get ingress $INGRESS_NAME -n $NAMESPACE -o jsonpath='{.spec.rules[0].host}')
      if [ "$HOSTNAME" = "$EXPECTED_HOSTNAME" ]; then
        echo "✅ Ingress has correct hostname: $EXPECTED_HOSTNAME"
        exit 0
      else
        echo "❌ Ingress has incorrect hostname: $HOSTNAME (expected: $EXPECTED_HOSTNAME)"
        exit 1
      fi
  - name: Ingress configured with TLS
    weight: 3
    run: |
      # Validate that the Ingress has TLS configured correctly

      INGRESS_NAME="secure-app"
      NAMESPACE="secure-ingress"
      EXPECTED_SECRET="secure-app-tls"
      EXPECTED_HOSTNAME="secure-app.example.com"

      # Check if ingress exists
      kubectl get ingress $INGRESS_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Ingress '$INGRESS_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if TLS is configured
      TLS_ENABLED=$(kubectl get ingress $INGRESS_NAME -n $NAMESPACE -o jsonpath='{.spec.tls}')
      if [ -z "$TLS_ENABLED" ]; then
        echo "❌ Ingress does not have TLS configured"
        exit 1
      fi

      # Check for correct TLS secret
      SECRET_NAME=$(kubectl get ingress $INGRESS_NAME -n $NAMESPACE -o jsonpath='{.spec.tls[0].secretName}')
      if [ "$SECRET_NAME" != "$EXPECTED_SECRET" ]; then
        echo "❌ Ingress uses incorrect TLS secret: $SECRET_NAME (expected: $EXPECTED_SECRET)"
        exit 1
      fi

      # Check for correct TLS host
      TLS_HOST=$(kubectl get ingress $INGRESS_NAME -n $NAMESPACE -o jsonpath='{.spec.tls[0].hosts[0]}')
      if [ "$TLS_HOST" != "$EXPECTED_HOSTNAME" ]; then
        echo "❌ Ingress TLS configured for incorrect host: $TLS_HOST (expected: $EXPECTED_HOSTNAME)"
        exit 1
      fi

      echo "✅ Ingress has correct TLS configuration"
      exit 0

solution:
  explain: |
    Create an Ingress resource with TLS:

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: secure-app
      namespace: secure-ingress
    spec:
      tls:
      - hosts:
        - secure-app.example.com
        secretName: secure-app-tls
      rules:
      - host: secure-app.example.com
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
    ```

    This Ingress:
    - Routes traffic for hostname `secure-app.example.com` to the `web-service` service
    - Uses the pre-created `secure-app-tls` secret for TLS termination
  run: |
    kubectl apply -f - <<'MANIFEST'
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: secure-app
      namespace: secure-ingress
    spec:
      tls:
      - hosts:
        - secure-app.example.com
        secretName: secure-app-tls
      rules:
      - host: secure-app.example.com
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
    MANIFEST
