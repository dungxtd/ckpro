# yaml-language-server: $schema=../../../schema/question.schema.json
title: TLS-Enabled Ingress
certifications:
  cks: cluster-setup
difficulty: hard
namespace: secure-ingress
tags: [ingress, tls]

statement: |
  Create a TLS-enabled Ingress resource named `secure-app` in the `secure-ingress` namespace for the service `web-service` (port 80).

  The Ingress should:
  - Respond to the hostname `secure-app.example.com`
  - Use a TLS secret named `secure-app-tls`

  The TLS secret has already been created in the `secure-ingress` namespace.

setup: |
  # Setup for Question 2: TLS-Enabled Ingress

  # Create namespace if it doesn't exist
  kubectl create namespace secure-ingress 2>/dev/null || true

  # Create a web service
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: Service
  metadata:
    name: web-service
    namespace: secure-ingress
  spec:
    selector:
      app: web
    ports:
    - port: 80
      targetPort: 80
  EOF

  # Create a deployment for the web service
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: web-deployment
    namespace: secure-ingress
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: web
    template:
      metadata:
        labels:
          app: web
      spec:
        containers:
        - name: nginx
          image: nginx
          ports:
          - containerPort: 80
  EOF

  # Create a TLS secret to be used in the Ingress
