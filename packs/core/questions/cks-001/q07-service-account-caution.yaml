# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X cks-001 question 7
title: Service Account Caution
certifications:  # review: domains guessed from concepts
  cks: cluster-hardening
difficulty: hard
namespace: service-account-caution
tags: [service accounts, automounting, least privilege]

statement: |
  In the `service-account-caution` namespace, create a Deployment named `secure-app` with 2 replicas that uses the `nginx` image.

  Configure the Deployment to use a custom ServiceAccount named `minimal-sa` that you will create. The ServiceAccount should have automounting of API credentials disabled.

  Additionally, configure the Pod template to explicitly disable service account token automounting.

setup: |
  # Setup for Question 7: Service Account Caution

  # Create namespace if it doesn't exist
  kubectl create namespace service-account-caution 2>/dev/null || true

  # Create a default deployment without service account settings for comparison
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: default-app
    namespace: service-account-caution
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: default-app
    template:
      metadata:
        labels:
          app: default-app
      spec:
        containers:
        - name: nginx
          image: nginx
  EOF

  echo "Setup completed for Question 7"
  exit 0

checks:
  - name: ServiceAccount exists
    run: |
      # Validate that ServiceAccount exists

      SA_NAME="minimal-sa"
      NAMESPACE="service-account-caution"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check if the service account exists
      kubectl get serviceaccount $SA_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ ServiceAccount '$SA_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      echo "✅ ServiceAccount exists"
      exit 0
  - name: ServiceAccount has automounting disabled
    weight: 2
    run: |
      # Validate that ServiceAccount has automounting disabled

      SA_NAME="minimal-sa"
      NAMESPACE="service-account-caution"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check if the service account exists
      kubectl get serviceaccount $SA_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ ServiceAccount '$SA_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if automountServiceAccountToken is set to false
      AUTOMOUNT=$(kubectl get serviceaccount $SA_NAME -n $NAMESPACE -o jsonpath='{.automountServiceAccountToken}')
      if [ "$AUTOMOUNT" != "false" ]; then
        echo "❌ ServiceAccount automountServiceAccountToken is not set to false"
        exit 1
      fi

      echo "✅ ServiceAccount has automounting disabled"
      exit 0
  - name: Deployment exists and uses the ServiceAccount
    run: |
      # Validate that deployment exists and uses the correct ServiceAccount

      DEPLOYMENT_NAME="secure-app"
      SA_NAME="minimal-sa"
      NAMESPACE="service-account-caution"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check if the deployment exists
      kubectl get deployment $DEPLOYMENT_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Deployment '$DEPLOYMENT_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if the deployment uses the correct service account
      DEPLOYMENT_SA=$(kubectl get deployment $DEPLOYMENT_NAME -n $NAMESPACE -o jsonpath='{.spec.template.spec.serviceAccountName}')
      if [ "$DEPLOYMENT_SA" != "$SA_NAME" ]; then
        echo "❌ Deployment does not use the correct ServiceAccount. Expected: $SA_NAME, Got: $DEPLOYMENT_SA"
        exit 1
      fi

      # Check if the deployment has 2 replicas
      REPLICAS=$(kubectl get deployment $DEPLOYMENT_NAME -n $NAMESPACE -o jsonpath='{.spec.replicas}')
      if [ "$REPLICAS" != "2" ]; then
        echo "❌ Deployment does not have 2 replicas. Got: $REPLICAS"
        exit 1
      fi

      # Check if the deployment uses the nginx image
      IMAGE=$(kubectl get deployment $DEPLOYMENT_NAME -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].image}')
      if [[ "$IMAGE" != *"nginx"* ]]; then
        echo "❌ Deployment does not use the nginx image. Got: $IMAGE"
        exit 1
      fi

      echo "✅ Deployment exists and uses the correct ServiceAccount"
      exit 0
  - name: Pod automounting explicitly disabled
    run: |
      # Validate that pod automounting is explicitly disabled

      DEPLOYMENT_NAME="secure-app"
      NAMESPACE="service-account-caution"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check if the deployment exists
      kubectl get deployment $DEPLOYMENT_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Deployment '$DEPLOYMENT_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if automounting is explicitly disabled in pod spec
      POD_AUTOMOUNT=$(kubectl get deployment $DEPLOYMENT_NAME -n $NAMESPACE -o jsonpath='{.spec.template.spec.automountServiceAccountToken}')
      if [ "$POD_AUTOMOUNT" != "false" ]; then
        echo "❌ Pod spec does not have automountServiceAccountToken explicitly set to false"
        exit 1
      fi

      echo "✅ Pod automounting is explicitly disabled"
      exit 0

solution:
  explain: |
    Create ServiceAccount with disabled automounting:

    ```yaml
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: minimal-sa
      namespace: service-account-caution
    automountServiceAccountToken: false
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: secure-app
      namespace: service-account-caution
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: secure-app
      template:
        metadata:
          labels:
            app: secure-app
        spec:
          serviceAccountName: minimal-sa
          automountServiceAccountToken: false
          containers:
          - name: nginx
            image: nginx
    ```
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
  run: "true  # TODO: commands that solve the task"
