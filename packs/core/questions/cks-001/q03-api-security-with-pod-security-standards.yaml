# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X cks-001 question 3
title: API Security with Pod Security Standards
certifications:  # review: domains guessed from concepts
  cks: cluster-hardening
difficulty: hard
namespace: api-security
tags: [api security, pod security standards, rbac]

statement: |
  Enhance the security of the Kubernetes API server by configuring a Pod Security Policy (PSP) or Pod Security Standard (PSS):

  1. Create a namespace named `api-security`

  2. Apply a label to the namespace to enforce the `baseline` Pod Security Standard: `pod-security.kubernetes.io/enforce=baseline`

  3. Create a pod named `secure-pod` using the `nginx` image that complies with the baseline Pod Security Standard.

  4. Create a Role named `pss-viewer-role` and RoleBinding named `pss-viewer-binding` that allow a ServiceAccount named `pss-viewer` (which has already been created) to view the pod security standards applied to namespaces.

setup: |
  # Setup for Question 3: API Security with Pod Security Standards

  # Create namespace if it doesn't exist
  kubectl create namespace api-security 2>/dev/null || true

  # Create the PSS viewer ServiceAccount
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: pss-viewer
    namespace: api-security
  EOF

  # Create a sample pod for testing
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: Pod
  metadata:
    name: sample-pod
    namespace: api-security
  spec:
    containers:
    - name: nginx
      image: nginx
  EOF

  echo "Setup completed for Question 3"
  exit 0

checks:
  - name: Namespace exists with correct label
    weight: 2
    run: |
      # Validate that the namespace exists with correct PSS label

      NAMESPACE="api-security"
      EXPECTED_PSS_LABEL="baseline"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check for correct Pod Security Standard label
      PSS_LABEL=$(kubectl get namespace $NAMESPACE -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}')
      if [ "$PSS_LABEL" = "$EXPECTED_PSS_LABEL" ]; then
        echo "✅ Namespace has correct Pod Security Standard label: $EXPECTED_PSS_LABEL"
        exit 0
      else
        echo "❌ Namespace does not have correct Pod Security Standard label (expected: $EXPECTED_PSS_LABEL, got: $PSS_LABEL)"
        exit 1
      fi
  - name: Secure pod exists
    run: |
      # Validate that the secure pod exists and complies with Pod Security Standards

      POD_NAME="secure-pod"
      NAMESPACE="api-security"

      # Check if pod exists
      kubectl get pod $POD_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Pod '$POD_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if pod is running
      POD_STATUS=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.status.phase}')
      if [ "$POD_STATUS" != "Running" ]; then
        echo "❌ Pod '$POD_NAME' is not in Running state (current state: $POD_STATUS)"
        exit 1
      fi

      # Check if pod complies with baseline PSS by checking if it runs as non-root
      RUN_AS_NON_ROOT=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.securityContext.runAsNonRoot}')
      if [ "$RUN_AS_NON_ROOT" != "true" ]; then
        echo "❌ Pod does not have runAsNonRoot set to true in its securityContext"
        exit 1
      fi

      # Check if pod does not allow privilege escalation
      ALLOW_PRIV_ESC=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.containers[0].securityContext.allowPrivilegeEscalation}')
      if [ "$ALLOW_PRIV_ESC" != "false" ]; then
        echo "❌ Pod allows privilege escalation (allowPrivilegeEscalation should be set to false)"
        exit 1
      fi

      echo "✅ Pod exists and complies with Pod Security Standards"
      exit 0
  - name: Role and RoleBinding exist
    weight: 2
    run: |
      # Validate that the Role and RoleBinding exist and have correct configurations

      ROLE_NAME="pss-viewer-role"
      ROLEBINDING_NAME="pss-viewer-binding"
      SERVICE_ACCOUNT="pss-viewer"
      NAMESPACE="api-security"

      # Check if Role exists
      kubectl get role $ROLE_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Role '$ROLE_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if RoleBinding exists
      kubectl get rolebinding $ROLEBINDING_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ RoleBinding '$ROLEBINDING_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if Role allows getting namespaces (to check PSS)
      CAN_GET_NAMESPACES=$(kubectl get role $ROLE_NAME -n $NAMESPACE -o jsonpath='{.rules[*].resources}' | grep -o "namespaces")
      if [ -z "$CAN_GET_NAMESPACES" ]; then
        echo "❌ Role does not allow viewing namespaces"
        exit 1
      fi

      # Check if RoleBinding references the correct Role
      ROLE_REF_NAME=$(kubectl get rolebinding $ROLEBINDING_NAME -n $NAMESPACE -o jsonpath='{.roleRef.name}')
      if [ "$ROLE_REF_NAME" != "$ROLE_NAME" ]; then
        echo "❌ RoleBinding does not reference the correct Role"
        exit 1
      fi

      # Check if RoleBinding binds to the correct ServiceAccount
      SA_NAME=$(kubectl get rolebinding $ROLEBINDING_NAME -n $NAMESPACE -o jsonpath='{.subjects[?(@.kind=="ServiceAccount")].name}')
      if [ "$SA_NAME" != "$SERVICE_ACCOUNT" ]; then
        echo "❌ RoleBinding does not bind to the correct ServiceAccount"
        exit 1
      fi

      echo "✅ Role and RoleBinding exist and are configured correctly"
      exit 0

solution:
  explain: |
    Create a namespace with Pod Security Standard:

    ```yaml
    apiVersion: v1
    kind: Namespace
    metadata:
      name: api-security
      labels:
        pod-security.kubernetes.io/enforce: baseline
    ```

    Create a secure pod:

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: secure-pod
      namespace: api-security
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: nginx
        image: nginx
        securityContext:
          allowPrivilegeEscalation: false
    ```

    Create Role and RoleBinding for PSS viewing:

    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: pss-viewer-role
      namespace: api-security
    rules:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get"]
    - apiGroups: [""]
      resources: ["namespaces/status"]
      verbs: ["get"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: pss-viewer-binding
      namespace: api-security
    subjects:
    - kind: ServiceAccount
      name: pss-viewer
      namespace: api-security
    roleRef:
      kind: Role
      name: pss-viewer-role
      apiGroup: rbac.authorization.k8s.io
    ```

    This implementation:
    - Creates a namespace with the Pod Security Standard "baseline" enforcement
    - Deploys a pod that complies with the baseline standard (non-root, no privilege escalation)
    - Sets up RBAC permissions for the PSS viewer service account
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
  run: |
    kubectl apply -f - <<'MANIFEST'
    apiVersion: v1
    kind: Namespace
    metadata:
      name: api-security
      labels:
        pod-security.kubernetes.io/enforce: baseline
    MANIFEST

    kubectl apply -f - <<'MANIFEST'
    apiVersion: v1
    kind: Pod
    metadata:
      name: secure-pod
      namespace: api-security
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: nginx
        image: nginx
        securityContext:
          allowPrivilegeEscalation: false
    MANIFEST

    kubectl apply -f - <<'MANIFEST'
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: pss-viewer-role
      namespace: api-security
    rules:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get"]
    - apiGroups: [""]
      resources: ["namespaces/status"]
      verbs: ["get"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: pss-viewer-binding
      namespace: api-security
    subjects:
    - kind: ServiceAccount
      name: pss-viewer
      namespace: api-security
    roleRef:
      kind: Role
      name: pss-viewer-role
      apiGroup: rbac.authorization.k8s.io
    MANIFEST
