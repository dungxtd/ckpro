# yaml-language-server: $schema=../../../schema/question.schema.json
title: Node Metadata Protection
certifications:
  cks: cluster-setup
difficulty: hard
namespace: metadata-protect
tags: [network policies, metadata protection]

statement: |
  Protect the Kubernetes node metadata from being accessed by pods. Create a NetworkPolicy named `block-metadata` in the `metadata-protect` namespace that blocks outbound access from all pods to the Kubernetes metadata endpoint (usually at 169.254.169.254).

  Verify your implementation by creating a pod named `test-pod` in the same namespace using the `busybox` image with a command that sleeps for 3600 seconds.

setup: |
  # Setup for Question 4: Node Metadata Protection

  # Create namespace if it doesn't exist
  kubectl create namespace metadata-protect 2>/dev/null || true

  # Create a test pod that can access the metadata endpoint
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: Pod
  metadata:
    name: metadata-checker
    namespace: metadata-protect
  spec:
    containers:
    - name: busybox
      image: busybox
      command: ["sleep", "3600"]
  EOF

  echo "Setup completed for Question 4"
  exit 0

checks:
  - name: NetworkPolicy exists
    weight: 2
    run: |
      # Validate that the NetworkPolicy exists

      POLICY_NAME="block-metadata"
      NAMESPACE="metadata-protect"

      kubectl get networkpolicy $POLICY_NAME -n $NAMESPACE &> /dev/null
      if [ $? -eq 0 ]; then
        echo "✅ NetworkPolicy '$POLICY_NAME' exists in namespace '$NAMESPACE'"
        exit 0
      else
        echo "❌ NetworkPolicy '$POLICY_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi
  - name: NetworkPolicy blocks metadata access
    weight: 2
    run: |
      # Validate that the NetworkPolicy blocks metadata access

      POLICY_NAME="block-metadata"
      NAMESPACE="metadata-protect"
      METADATA_IP="169.254.169.254"

      # Check if policy exists
      kubectl get networkpolicy $POLICY_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ NetworkPolicy '$POLICY_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if policy includes Egress in policyTypes
      POLICY_TYPES=$(kubectl get networkpolicy $POLICY_NAME -n $NAMESPACE -o jsonpath='{.spec.policyTypes}')
      if [[ "$POLICY_TYPES" != *"Egress"* ]]; then
        echo "❌ NetworkPolicy does not include Egress in policyTypes"
        exit 1
      fi

      # Check for 169.254.169.254 denial in egress rules
      # This can be achieved in different ways:
      # 1. Using an except block with the metadata IP in it
      # 2. Explicitly denying traffic to the metadata IP
      # Let's check both possibilities

      # Check for except block first
      EXCEPT_BLOCKS=$(kubectl get networkpolicy $POLICY_NAME -n $NAMESPACE -o jsonpath='{.spec.egress[*].to[*].ipBlock.except}')
      if [[ "$EXCEPT_BLOCKS" == *"$METADATA_IP"* ]]; then
        echo "✅ NetworkPolicy correctly blocks metadata IP ($METADATA_IP) using except block"
        exit 0
      fi

      # Check if there's a rule that explicitly allows all except the metadata IP
      # This is a more complex check and might be implemented in different ways
      # For simplicity, we'll check if there's a rule that allows all traffic and excludes metadata
      ALLOWS_ALL=$(kubectl get networkpolicy $POLICY_NAME -n $NAMESPACE -o jsonpath='{.spec.egress[*].to[*].ipBlock.cidr}')
      if [[ "$ALLOWS_ALL" == *"0.0.0.0/0"* ]] && [[ "$EXCEPT_BLOCKS" == *"$METADATA_IP"* ]]; then
        echo "✅ NetworkPolicy allows all traffic but blocks metadata IP ($METADATA_IP)"
        exit 0
      fi

      # If we reached here, the policy doesn't explicitly block the metadata IP
      echo "❌ NetworkPolicy does not block access to metadata IP ($METADATA_IP)"
      exit 1
  - name: Test pod exists
    run: |
      # Validate that the test pod exists

      POD_NAME="test-pod"
      NAMESPACE="metadata-protect"

      # Check if pod exists
      kubectl get pod $POD_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Pod '$POD_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if pod is running
      POD_STATUS=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.status.phase}')
      if [ "$POD_STATUS" != "Running" ]; then
        echo "❌ Pod '$POD_NAME' is not in Running state (current state: $POD_STATUS)"
        exit 1
      fi

      # Check if pod uses the busybox image as required
      POD_IMAGE=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.containers[0].image}')
      if [[ "$POD_IMAGE" != *"busybox"* ]]; then
        echo "❌ Pod '$POD_NAME' is not using the busybox image (current image: $POD_IMAGE)"
        exit 1
      fi

      # Check if pod has sleep command
      POD_COMMAND=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.containers[0].command}')
      if [[ "$POD_COMMAND" != *"sleep"* ]]; then
        echo "❌ Pod '$POD_NAME' is not running sleep command"
        exit 1
      fi

      echo "✅ Test pod exists and is correctly configured"
      exit 0

solution:
  explain: |
    Create a NetworkPolicy to block metadata access:

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: block-metadata
      namespace: metadata-protect
    spec:
      podSelector: {}  # Apply to all pods
      policyTypes:
      - Egress
      egress:
      - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
            - 169.254.169.254/32
    ```

    Create a test pod:

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: test-pod
      namespace: metadata-protect
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sleep", "3600"]
    ```
  run: |
    kubectl apply -f - <<'MANIFEST'
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: block-metadata
      namespace: metadata-protect
    spec:
      podSelector: {}  # Apply to all pods
      policyTypes:
      - Egress
      egress:
      - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
            - 169.254.169.254/32
    MANIFEST

    kubectl apply -f - <<'MANIFEST'
    apiVersion: v1
    kind: Pod
    metadata:
      name: test-pod
      namespace: metadata-protect
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sleep", "3600"]
    MANIFEST
