# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X cks-001 question 11
title: Pod Security Standards
certifications:  # review: domains guessed from concepts
  cks: minimize-microservice-vulnerabilities
difficulty: hard
namespace: pod-security
tags: [pod security standards, namespace labels]

statement: |
  Label the `pod-security` namespace to enforce the `baseline` Pod Security Standard.

  Then, create a pod named `compliant-pod` that complies with the baseline Pod Security Standard.

  Finally, attempt to create a pod named `non-compliant-pod` that violates the standard by running as root and with privileged security context. Document the error in a file named `/tmp/violation.txt`.

setup: |
  # Setup for Question 11: Pod Security Standards

  # Create namespace if it doesn't exist
  kubectl create namespace pod-security 2>/dev/null || true

  # Create a sample pod to demonstrate what happens without PSS
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: Pod
  metadata:
    name: privileged-pod
    namespace: pod-security
  spec:
    containers:
    - name: nginx
      image: nginx
      securityContext:
        privileged: true
  EOF

  # Create a ConfigMap with information about Pod Security Standards
  kubectl apply -f - <<EOF
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: pss-info
    namespace: pod-security
  data:
    standards.txt: |
      Pod Security Standards provide three different levels of security:

      1. Privileged: Unrestricted policy, providing the widest possible level of permissions
      2. Baseline: Minimally restrictive policy, preventing known privilege escalations
      3. Restricted: Heavily restricted policy, following current Pod hardening best practices

      To enforce these standards, use the following namespace labels:
      - pod-security.kubernetes.io/enforce: <policy level>
      - pod-security.kubernetes.io/audit: <policy level>
      - pod-security.kubernetes.io/warn: <policy level>
  EOF

  echo "Setup completed for Question 11"
  exit 0

checks:
  - name: Namespace has correct labels
    weight: 2
    run: |
      # Validate that namespace has correct Pod Security Standard labels

      NAMESPACE="pod-security"
      EXPECTED_ENFORCE="baseline"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check if namespace has PSS enforce label set to baseline
      ENFORCE_LABEL=$(kubectl get namespace $NAMESPACE -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}')
      if [ "$ENFORCE_LABEL" != "$EXPECTED_ENFORCE" ]; then
        echo "❌ Namespace doesn't have the correct pod-security.kubernetes.io/enforce label. Expected: $EXPECTED_ENFORCE, Got: $ENFORCE_LABEL"
        exit 1
      fi

      echo "✅ Namespace has correct Pod Security Standard labels"
      exit 0
  - name: Compliant pod exists
    run: |
      # Validate that compliant pod exists

      POD_NAME="compliant-pod"
      NAMESPACE="pod-security"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check if pod exists
      kubectl get pod $POD_NAME -n $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Pod '$POD_NAME' not found in namespace '$NAMESPACE'"
        exit 1
      fi

      # Check if pod is running (which means it complies with PSS)
      POD_STATUS=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.status.phase}')
      if [ "$POD_STATUS" != "Running" ]; then
        echo "❌ Pod is not in Running state. Current state: $POD_STATUS"
        exit 1
      fi

      # Verify basic PSS baseline compliance
      # Check if runAsNonRoot is set
      RUN_AS_NON_ROOT=$(kubectl get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.spec.securityContext.runAsNonRoot}')
      if [ "$RUN_AS_NON_ROOT" != "true" ]; then
        echo "❌ Pod is not compliant with baseline PSS: runAsNonRoot not set to true"
        exit 1
      fi

      echo "✅ Compliant pod exists"
      exit 0
  - name: Non-compliant pod is rejected
    weight: 2
    run: |
      # Validate that non-compliant pod is rejected and documented

      POD_NAME="non-compliant-pod"
      NAMESPACE="pod-security"
      VIOLATION_FILE="/tmp/violation.txt"

      # Check if namespace exists
      kubectl get namespace $NAMESPACE &> /dev/null
      if [ $? -ne 0 ]; then
        echo "❌ Namespace '$NAMESPACE' not found"
        exit 1
      fi

      # Check if pod was rejected (should not exist)
      if kubectl get pod $POD_NAME -n $NAMESPACE &> /dev/null; then
        echo "❌ Non-compliant pod exists, but it should have been rejected"
        exit 1
      fi

      # Check if violation was documented
      if [ ! -f "$VIOLATION_FILE" ]; then
        echo "❌ Violation documentation file not found at $VIOLATION_FILE"
        exit 1
      fi

      # Check if the file contains relevant error message
      if ! grep -q "forbidden" "$VIOLATION_FILE" && ! grep -q "violat" "$VIOLATION_FILE" && ! grep -q "deny" "$VIOLATION_FILE" && ! grep -q "reject" "$VIOLATION_FILE"; then
        echo "❌ Violation documentation doesn't contain relevant error message"
        exit 1
      fi

      echo "✅ Non-compliant pod was correctly rejected and documented"
      exit 0

solution:
  explain: |
    Apply Pod Security Standards:

    ```bash
    # Label the namespace
    kubectl label namespace pod-security pod-security.kubernetes.io/enforce=baseline
    ```

    Create a compliant pod:

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: compliant-pod
      namespace: pod-security
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: nginx
        image: nginx
        securityContext:
          allowPrivilegeEscalation: false
    ```

    Try to create a non-compliant pod and document the error:

    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: non-compliant-pod
      namespace: pod-security
    spec:
      containers:
      - name: nginx
        image: nginx
        securityContext:
          privileged: true
    ```
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
  run: |
    # Label the namespace
    kubectl label namespace pod-security pod-security.kubernetes.io/enforce=baseline
