      rules:
      - matches:
        - path:
            value: /app1
        backendRefs:
        - name: app1-svc
          port: 8080
      - matches:
        - path:
            value: /app2
        backendRefs:
        - name: app2-svc
          port: 8080
    ---
    apiVersion: apps/v1
