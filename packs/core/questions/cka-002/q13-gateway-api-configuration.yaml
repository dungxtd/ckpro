    spec:
      replicas: 1
      selector:
        matchLabels:
          app: app1
      template:
        metadata:
          labels:
            app: app1
        spec:
          containers:
          - name: nginx
            image: nginx
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: app1-svc
