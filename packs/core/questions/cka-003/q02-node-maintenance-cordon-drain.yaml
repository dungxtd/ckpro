# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X cka-003 question 2
title: "Node Maintenance (Cordon + Drain)"
certifications:  # review: domains guessed from concepts
  cka: workloads-scheduling
difficulty: hard
workers: 3
namespace: node-ops
tags: [node-maintenance, cordon, drain, eviction]

statement: |
  A node in the cluster has been labeled `drain-target=true` and is currently running workloads from the `node-ops/drain-target` Deployment.

  Mark the node labeled `drain-target=true` as unschedulable, and safely evict/reschedule all non-DaemonSet pods running on it, so that its workloads continue running elsewhere in the cluster.

  Use the standard `kubectl cordon` and `kubectl drain` workflow (the node should remain cordoned afterwards).

setup: |
  set -e

  # Create namespace
  kubectl create namespace node-ops --dry-run=client -o yaml | kubectl apply -f -

  # Dynamically pick a worker (non control-plane) node to be the drain target
  TARGET_NODE=$(kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{.items[0].metadata.name}')
  if [ -z "$TARGET_NODE" ]; then
    echo "No worker node found to label as drain-target"
    exit 1
  fi

  echo "Labeling node $TARGET_NODE with drain-target=true"
  kubectl label node "$TARGET_NODE" drain-target=true --overwrite

  # Hard (NoSchedule) taint so unrelated pods from OTHER questions (including
  # candidate-authored bare Pods with no controller, e.g. Q9's kucc8, and other
  # setup-created bare Pods, e.g. Q13's overloaded-cpu-*) can never land on this
  # node. This does not block Q2's own drain-target Deployment below - it
  # explicitly tolerates this taint - and it doesn't
  # block cordon/drain themselves, which only affect NEW scheduling decisions,
  # not eviction. A softer PreferNoSchedule taint was tried first but is only a
  # scheduler preference, not a guarantee, and still let unrelated bare Pods land
  # here often enough in testing to matter: if an unrelated bare Pod ends up here
  # and the candidate later legitimately drains this node for Q2, that Pod would
  # be evicted and (having no controller) never rescheduled, permanently failing
  # its own question.
  kubectl taint node "$TARGET_NODE" drain-target=true:NoSchedule --overwrite

  # Deploy a workload pinned to the labeled node so there is something real to drain/reschedule
  kubectl apply -f - <<EOF
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: drain-target
    namespace: node-ops
    labels:
      app: drain-target
  spec:
    replicas: 3
    selector:
      matchLabels:
        app: drain-target
    template:
      metadata:
        labels:
          app: drain-target
      spec:
        nodeSelector:
          drain-target: "true"
        # Only this question's taint: tolerating everything would also
        # tolerate the cordon (node.kubernetes.io/unschedulable) and put
        # replacement pods back on the drained node
        tolerations:
          - key: drain-target
            operator: Equal
            value: "true"
            effect: NoSchedule
        containers:
          - name: pause
            image: busybox:1.36
            command: ["sh", "-c", "sleep 3600"]
  EOF

  echo "Waiting for drain-target deployment pods to be scheduled on $TARGET_NODE..."
  kubectl wait --for=condition=available --timeout=120s deployment/drain-target -n node-ops || {
    echo "WARNING: drain-target deployment did not become available in time, continuing anyway"
  }

  # The nodeSelector was only needed to force initial placement onto the target node.
  # Remove it now so that once the candidate drains/cordons the node, the ReplicaSet's
  # replacement pods are free to be rescheduled onto any other schedulable node
  # (mirrors real-world workloads, which are not normally hard-pinned to a single node).
  kubectl patch deployment drain-target -n node-ops --type='json' \
    -p='[{"op": "remove", "path": "/spec/template/spec/nodeSelector"}]' || {
    echo "WARNING: could not remove nodeSelector from drain-target deployment, continuing anyway"
  }

checks:
  - name: "The node labeled drain-target=true is cordoned (spec.unschedulable=true)"
    weight: 3
    run: |
      set -e

      TARGET_NODE=$(kubectl get nodes -l drain-target=true -o jsonpath='{.items[0].metadata.name}')
      if [[ -z "$TARGET_NODE" ]]; then
          echo "Could not find node labeled drain-target=true"
          exit 1
      fi

      UNSCHEDULABLE=$(kubectl get node "$TARGET_NODE" -o jsonpath='{.spec.unschedulable}')
      if [[ "$UNSCHEDULABLE" != "true" ]]; then
          echo "Node $TARGET_NODE is not cordoned (spec.unschedulable=$UNSCHEDULABLE)"
          exit 1
      fi

      echo "Node $TARGET_NODE is correctly cordoned"
      exit 0
  - name: All drain-target Deployment pods are rescheduled off the cordoned node and Running
    weight: 4
    run: |
      set -e

      TARGET_NODE=$(kubectl get nodes -l drain-target=true -o jsonpath='{.items[0].metadata.name}')
      if [[ -z "$TARGET_NODE" ]]; then
          echo "Could not find node labeled drain-target=true"
          exit 1
      fi

      kubectl get deployment drain-target -n node-ops || {
          echo "Deployment drain-target not found in namespace node-ops"
          exit 1
      }

      PODS=$(kubectl get pods -n node-ops -l app=drain-target -o json)
      TOTAL=$(echo "$PODS" | jq '.items | length')
      ON_OTHER_NODE=$(echo "$PODS" | jq --arg n "$TARGET_NODE" '[.items[] | select(.spec.nodeName != $n and .spec.nodeName != null)] | length')
      RUNNING=$(echo "$PODS" | jq '[.items[] | select(.status.phase == "Running")] | length')

      if [[ "$TOTAL" -gt 0 && "$ON_OTHER_NODE" -eq "$TOTAL" && "$RUNNING" -eq "$TOTAL" ]]; then
          echo "All drain-target pods rescheduled off $TARGET_NODE and Running"
          exit 0
      fi

      echo "drain-target pods are not all rescheduled off $TARGET_NODE and Running"
      exit 1

solution:
  explain: |
    ### Solution
    ```bash
    NODE=$(kubectl get nodes -l drain-target=true -o jsonpath='{.items[0].metadata.name}')
    kubectl cordon "$NODE"
    kubectl drain "$NODE" --ignore-daemonsets --delete-emptydir-data --force
    ```

    ### Why this works
    `kubectl cordon` sets `spec.unschedulable: true` on the node so the scheduler stops placing new pods there, without touching existing pods. `kubectl drain` additionally evicts existing non-DaemonSet pods so their owning controllers (in this case the `drain-target` Deployment) recreate them on other schedulable nodes. `--ignore-daemonsets` is required because DaemonSet pods cannot be evicted, and `--delete-emptydir-data` is required if any pod uses `emptyDir` volumes.
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
  run: |
    NODE=$(kubectl get nodes -l drain-target=true -o jsonpath='{.items[0].metadata.name}')
    kubectl cordon "$NODE"
    kubectl drain "$NODE" --ignore-daemonsets --delete-emptydir-data --force
