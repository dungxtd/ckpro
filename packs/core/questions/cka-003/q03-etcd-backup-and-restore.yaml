# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X cka-003 question 3
title: etcd Backup and Restore
certifications:  # review: domains guessed from concepts
  cka: cluster-architecture
difficulty: hard
workers: 3
namespace: default
tags: [etcd, backup, restore, disaster-recovery]

statement: |
  First, create a snapshot of the running etcd cluster and save it to `/tmp/exam/etcd-snapshot.db`.

  Then, verify the snapshot is valid by restoring it into a new local data directory `/tmp/exam/etcd-restored`.

  This environment is not the real exam environment: use etcd endpoint `https://k8s-control-plane:2379`, with client certificates located at:

  - CA cert: `/root/.ckdry/etcd/k8s/ca.crt`
  - Client cert: `/root/.ckdry/etcd/k8s/client.crt`
  - Client key: `/root/.ckdry/etcd/k8s/client.key`

  Example commands:

  `ETCDCTL_API=3 etcdctl snapshot save /tmp/exam/etcd-snapshot.db --endpoints=https://k8s-control-plane:2379 --cacert=/root/.ckdry/etcd/k8s/ca.crt --cert=/root/.ckdry/etcd/k8s/client.crt --key=/root/.ckdry/etcd/k8s/client.key`

  `ETCDCTL_API=3 etcdctl snapshot restore /tmp/exam/etcd-snapshot.db --data-dir=/tmp/exam/etcd-restored`

setup: |
  set -e

  # The real etcd cluster (Part A infra change) and client certs at
  # /root/.ckdry/etcd/k8s already exist cluster-wide, nothing to provision here.
  mkdir -p /tmp/exam

checks:
  - name: "/tmp/exam/etcd-snapshot.db exists, is a non-trivial size, and passes 'etcdctl snapshot status'"
    weight: 4
    run: |
      set -e

      SNAPSHOT=/tmp/exam/etcd-snapshot.db

      if [[ ! -f "$SNAPSHOT" ]]; then
          echo "Snapshot file $SNAPSHOT does not exist"
          exit 1
      fi

      SIZE=$(stat -c%s "$SNAPSHOT" 2>/dev/null || stat -f%z "$SNAPSHOT" 2>/dev/null)
      if [[ -z "$SIZE" || "$SIZE" -lt 1024 ]]; then
          echo "Snapshot file $SNAPSHOT is missing or too small ($SIZE bytes) to be a real etcd snapshot"
          exit 1
      fi

      ETCDCTL_API=3 etcdctl snapshot status "$SNAPSHOT" \
        --cacert=/root/.ckdry/etcd/k8s/ca.crt \
        --cert=/root/.ckdry/etcd/k8s/client.crt \
        --key=/root/.ckdry/etcd/k8s/client.key \
        --write-out=table > /dev/null 2>&1 || {
          echo "etcdctl snapshot status reported the snapshot file is not a valid etcd snapshot"
          exit 1
      }

      echo "etcd snapshot validation successful"
      exit 0
  - name: "/tmp/exam/etcd-restored is a structurally valid etcd data directory produced by 'etcdctl snapshot restore'"
    weight: 3
    run: |
      set -e

      # NOTE: this environment has no node-level access to swap a restored data directory
      # into the live etcd static pod, so this check can only confirm that
      # `etcdctl snapshot restore` produced a structurally valid etcd data directory -
      # it does NOT (and cannot) verify the restored data was live-applied to the cluster.

      RESTORE_DIR=/tmp/exam/etcd-restored

      if [[ ! -d "$RESTORE_DIR" ]]; then
          echo "Restore directory $RESTORE_DIR does not exist"
          exit 1
      fi

      if [[ ! -d "$RESTORE_DIR/member/snap" ]]; then
          echo "Restore directory $RESTORE_DIR does not look like a valid etcd data directory (missing member/snap)"
          exit 1
      fi

      echo "etcd restore directory validation successful"
      exit 0

solution:
  explain: |
    ### Solution
    ```bash
    ETCDCTL_API=3 etcdctl snapshot save /tmp/exam/etcd-snapshot.db \
      --endpoints=https://k8s-control-plane:2379 \
      --cacert=/root/.ckdry/etcd/k8s/ca.crt \
      --cert=/root/.ckdry/etcd/k8s/client.crt \
      --key=/root/.ckdry/etcd/k8s/client.key

    ETCDCTL_API=3 etcdctl snapshot status /tmp/exam/etcd-snapshot.db --write-out=table

    ETCDCTL_API=3 etcdctl snapshot restore /tmp/exam/etcd-snapshot.db \
      --data-dir=/tmp/exam/etcd-restored
    ```

    ### Environment-specific adaptation
    On the real CKA exam you run these commands **on the control-plane node itself** (`ssh k8s-control-plane` here), with etcd listening on `https://127.0.0.1:2379` and certs under `/etc/kubernetes/pki/etcd/`. That works in this simulator too. For convenience the jumphost can also reach etcd at `k8s-control-plane:2379`, with a client cert in `/root/.ckdry/etcd/k8s/`; the commands above use that.

    Also note: verification in this lab only checks that `etcdctl snapshot restore` produced a **structurally valid** etcd data directory (i.e. it contains a `member/snap` subdirectory). To practise the full restore, ssh to `k8s-control-plane` and point `/etc/kubernetes/manifests/etcd.yaml` at the restored data directory.
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
  run: |
    ETCDCTL_API=3 etcdctl snapshot save /tmp/exam/etcd-snapshot.db \
      --endpoints=https://k8s-control-plane:2379 \
      --cacert=/root/.ckdry/etcd/k8s/ca.crt \
      --cert=/root/.ckdry/etcd/k8s/client.crt \
      --key=/root/.ckdry/etcd/k8s/client.key

    ETCDCTL_API=3 etcdctl snapshot status /tmp/exam/etcd-snapshot.db --write-out=table

    ETCDCTL_API=3 etcdctl snapshot restore /tmp/exam/etcd-snapshot.db \
      --data-dir=/tmp/exam/etcd-restored
