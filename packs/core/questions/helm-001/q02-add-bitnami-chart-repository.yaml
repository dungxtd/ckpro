# yaml-language-server: $schema=../../../schema/question.schema.json
title: Add Bitnami Chart Repository
certifications:
  cka: cluster-architecture
  ckad: application-deployment
difficulty: medium
namespace: default
tags: [helm, repositories]

statement: |
  Add the Bitnami chart repository to your Helm configuration with the name `bitnami` and URL `https://charts.bitnami.com/bitnami`.

  Update the repository to fetch the latest chart information. Verify success by listing all repositories.

setup: |
  # Setup environment for Question 2 - Adding Bitnami Helm Repository

  # No specific setup needed for this question
  # This is a task for the student to add the Bitnami repo
  # The student needs to run the following commands:
  # helm repo add bitnami https://charts.bitnami.com/bitnami
  # helm repo update
  # helm repo list

  echo "Environment setup complete for Question 2"
  exit 0

checks:
  - name: Bitnami repo is added
    weight: 4
    run: |
      # Validate script for Question 2, Step 1: Check if Bitnami repo is added

      # Check if helm command is available
      if ! command -v helm &> /dev/null; then
        echo "❌ Helm command not found in PATH"
        exit 1
      fi

      # Get the list of repositories
      repo_list=$(helm repo list 2>&1)

      # Check if the command was successful
      if [ $? -ne 0 ]; then
        echo "❌ Failed to list Helm repositories"
        echo "Error: $repo_list"
        exit 1
      fi

      # Check if Bitnami repo is in the list
      if ! echo "$repo_list" | grep -q "bitnami"; then
        echo "❌ Bitnami repository not found in Helm repositories"
        echo "Current repositories:"
        echo "$repo_list"
        exit 1
      fi

      # Check if the URL is correct
      if ! echo "$repo_list" | grep -q "bitnami.*https://charts.bitnami.com/bitnami"; then
        echo "❌ Bitnami repository found but URL is incorrect"
        echo "Current repositories:"
        echo "$repo_list"
        exit 1
      fi

      echo "✅ Bitnami repository is properly added to Helm"
      echo "Repository list:"
      echo "$repo_list"
      exit 0

solution:
  explain: |
    ```bash
    # Add Bitnami repo
    helm repo add bitnami https://charts.bitnami.com/bitnami

    # Update repo to fetch the latest chart information
    helm repo update

    # Verify by listing repositories
    helm repo list
    ```
  run: |
    # Add Bitnami repo
    helm repo add bitnami https://charts.bitnami.com/bitnami

    # Update repo to fetch the latest chart information
    helm repo update

    # Verify by listing repositories
    helm repo list
