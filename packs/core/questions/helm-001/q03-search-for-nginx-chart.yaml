# yaml-language-server: $schema=../../../schema/question.schema.json
title: Search for Nginx Chart
certifications:
  cka: cluster-architecture
  ckad: application-deployment
difficulty: medium
namespace: default
tags: [helm, chart search]

statement: |
  Search for the nginx chart in the Bitnami repository.

  Store the search results in a file at `/tmp/exam/q3/nginx-charts.txt`.

setup: |
  # Setup environment for Question 3 - Search for Nginx Chart

  # Create necessary directories
  mkdir -p /tmp/exam/q3

  # No other setup needed for this question
  # The student will need to search for the nginx chart in the Bitnami repository
  # and save the results to /tmp/exam/q3/nginx-charts.txt

  echo "Environment setup complete for Question 3"
  exit 0

checks:
  - name: Search results are saved correctly
    weight: 4
    run: |
      # Validate script for Question 3, Step 1: Check if nginx chart search results are saved

      # Check if the results file exists
      if [ ! -f /tmp/exam/q3/nginx-charts.txt ]; then
        echo "❌ Search results file does not exist at /tmp/exam/q3/nginx-charts.txt"
        exit 1
      fi

      # Check if the file has content
      if [ ! -s /tmp/exam/q3/nginx-charts.txt ]; then
        echo "❌ Search results file exists but is empty"
        exit 1
      fi

      # Check if the file contains nginx chart information from Bitnami
      if ! grep -q "bitnami/nginx" /tmp/exam/q3/nginx-charts.txt; then
        echo "❌ Search results file does not contain Bitnami nginx chart information"
        echo "File content:"
        cat /tmp/exam/q3/nginx-charts.txt
        exit 1
      fi

      # Check if the file appears to be the output of a helm search command
      if ! grep -q "NAME\|VERSION\|DESCRIPTION" /tmp/exam/q3/nginx-charts.txt; then
        echo "❌ Search results file does not appear to be from helm search command"
        echo "Expected headers like 'NAME', 'VERSION', 'DESCRIPTION'"
        echo "File content:"
        cat /tmp/exam/q3/nginx-charts.txt
        exit 1
      fi

      echo "✅ Nginx chart search results are correctly saved"
      echo "Sample content:"
      head -5 /tmp/exam/q3/nginx-charts.txt
      exit 0

solution:
  explain: |
    ```bash
    # Search for nginx in the Bitnami repo
    helm search repo bitnami/nginx

    # Save the results to a file
    helm search repo bitnami/nginx > /tmp/exam/q3/nginx-charts.txt
    ```
  run: |
    # Search for nginx in the Bitnami repo
    helm search repo bitnami/nginx

    # Save the results to a file
    helm search repo bitnami/nginx > /tmp/exam/q3/nginx-charts.txt
