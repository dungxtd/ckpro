# yaml-language-server: $schema=../../../schema/question.schema.json
title: Create a New Helm Chart
certifications:
  cka: cluster-architecture
  ckad: application-deployment
difficulty: medium
namespace: default
tags: [helm, chart creation]

statement: |
  Create a new Helm chart named `webapp` using the Helm create command.

  Modify the Chart.yaml to include a description: "A simple web application" and set the appVersion to "1.2.3".

setup: |
  # Setup environment for Question 9 - Create New Helm Chart

  # No specific setup needed for this question
  # The student needs to create a new Helm chart named webapp
  # using the helm create command and modify Chart.yaml

  echo "Environment setup complete for Question 9"
  exit 0

checks:
  - name: Chart structure created
    weight: 2
    run: |
      # Validate script for Question 9, Step 1: Check if chart structure is created

      # Check if the chart directory exists
      if [ ! -d webapp ]; then
        echo "❌ Chart directory 'webapp' not found in current directory"
        echo "Current directory contents:"
        ls -la
        exit 1
      fi

      # Check for standard Helm chart files and directories
      required_files=("Chart.yaml" "values.yaml" "templates/deployment.yaml" "templates/service.yaml")
      for file in "${required_files[@]}"; do
        if [ ! -f "webapp/$file" ]; then
          echo "❌ Required chart file 'webapp/$file' not found"
          echo "Chart structure is incomplete"
          exit 1
        fi
      done

      # Check for Helm chart helper files
      if [ ! -f "webapp/templates/_helpers.tpl" ] || [ ! -f "webapp/templates/NOTES.txt" ]; then
        echo "❌ Chart helper files not found"
        echo "Expected 'webapp/templates/_helpers.tpl' and 'webapp/templates/NOTES.txt'"
        exit 1
      fi

      echo "✅ Helm chart 'webapp' created with the correct structure"
      echo "Chart structure:"
      find webapp -type f | sort
      exit 0
  - name: Chart.yaml modified correctly
    weight: 2
    run: |
      # Validate script for Question 9, Step 2: Check if Chart.yaml is modified correctly

      # Check if the Chart.yaml file exists
      if [ ! -f webapp/Chart.yaml ]; then
        echo "❌ Chart.yaml not found in webapp directory"
        exit 1
      fi

      # Check if the description is set correctly
      description=$(grep "description:" webapp/Chart.yaml | sed 's/description: //g' | tr -d '"' | tr -d "'" | xargs)
      if [ "$description" != "A simple web application" ]; then
        echo "❌ Chart description is not set to 'A simple web application'"
        echo "Current description: $description"
        exit 1
      fi

      # Check if the appVersion is set correctly
      app_version=$(grep "appVersion:" webapp/Chart.yaml | sed 's/appVersion: //g' | tr -d '"' | tr -d "'" | xargs)
      if [ "$app_version" != "1.2.3" ]; then
        echo "❌ Chart appVersion is not set to '1.2.3'"
        echo "Current appVersion: $app_version"
        exit 1
      fi

      echo "✅ Chart.yaml is modified correctly with the required metadata"
      echo "Chart.yaml content:"
      cat webapp/Chart.yaml
      exit 0

solution:
  explain: |
    ```bash
    # Create a new chart
    helm create webapp

    # Modify the Chart.yaml file
    cat > webapp/Chart.yaml << EOF
    apiVersion: v2
    name: webapp
    description: A simple web application
    type: application
    version: 0.1.0
    appVersion: "1.2.3"
    EOF
    ```
  run: |
    # Create a new chart
    helm create webapp

    # Modify the Chart.yaml file
    cat > webapp/Chart.yaml << EOF
    apiVersion: v2
    name: webapp
    description: A simple web application
    type: application
    version: 0.1.0
    appVersion: "1.2.3"
    EOF
