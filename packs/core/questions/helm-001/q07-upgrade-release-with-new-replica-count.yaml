# yaml-language-server: $schema=../../../schema/question.schema.json
title: Upgrade Release with New Replica Count
certifications:
  cka: cluster-architecture
  ckad: application-deployment
difficulty: medium
namespace: default
tags: [helm, release upgrade]

statement: |
  Upgrade the `web-server` release to set replica count to 3.

  Verify the update was successful by checking the number of pods.

setup: |
  # Setup environment for Question 7 - Upgrade Release

  # No specific setup needed for this question
  # The student needs to upgrade the web-server release to set replica count to 3
  # The expected command would be something like:
  # helm upgrade web-server bitnami/nginx --set replicaCount=3

  echo "Environment setup complete for Question 7"
  exit 0

checks:
  - name: Release was upgraded
    weight: 2
    run: |
      # Validate script for Question 7, Step 1: Check if release was upgraded

      # Check if helm command is available
      if ! command -v helm &> /dev/null; then
        echo "❌ Helm command not found in PATH"
        exit 1
      fi

      # Check if the release exists
      release_info=$(helm list -n default -f "web-server" 2>&1)

      if [ $? -ne 0 ] || ! echo "$release_info" | grep -q "web-server"; then
        echo "❌ Release 'web-server' not found in namespace 'default'"
        echo "Current releases:"
        helm list -n default
        exit 1
      fi

      # Check if it's been upgraded (revision > 1)
      revision=$(helm list -n default -f "web-server" -o json | jq -r '.[0].revision')

      if [ -z "$revision" ] || [ "$revision" = "null" ]; then
        echo "❌ Could not determine revision for release 'web-server'"
        exit 1
      fi

      if [ "$revision" -le 1 ]; then
        echo "❌ Release 'web-server' has not been upgraded (revision: $revision)"
        exit 1
      fi

      echo "✅ Release 'web-server' has been upgraded to revision $revision"
      exit 0
  - name: Replica count is 3
    weight: 2
    run: |
      # Validate script for Question 7, Step 2: Check if replica count is 3

      # Check if kubectl command is available
      if ! command -v kubectl &> /dev/null; then
        echo "❌ kubectl command not found in PATH"
        exit 1
      fi

      # Find the deployment name (assuming it has web-server and nginx in the name)
      deploy_name=$(kubectl get deployments -n default -o custom-columns=NAME:.metadata.name | grep "web-server.*nginx")

      if [ -z "$deploy_name" ]; then
        echo "❌ Could not find the web-server nginx deployment"
        echo "Available deployments:"
        kubectl get deployments -n default
        exit 1
      fi

      # Get the replica count
      replicas=$(kubectl get deployment $deploy_name -n default -o jsonpath='{.spec.replicas}')

      if [ -z "$replicas" ]; then
        echo "❌ Could not determine replica count for deployment '$deploy_name'"
        exit 1
      fi

      if [ "$replicas" -ne 3 ]; then
        echo "❌ Deployment '$deploy_name' does not have 3 replicas (current: $replicas)"
        exit 1
      fi

      # Also check if the pods are actually running
      ready_pods=$(kubectl get deployment $deploy_name -n default -o jsonpath='{.status.readyReplicas}')
      if [ -z "$ready_pods" ] || [ "$ready_pods" -ne 3 ]; then
        echo "❌ Deployment has 3 replicas set but only $ready_pods pods are ready"
        echo "Pods status:"
        kubectl get pods -n default -l app=nginx,release=web-server
        exit 1
      fi

      echo "✅ Deployment '$deploy_name' has 3 replicas and all pods are ready"
      echo "Pods status:"
      kubectl get pods -n default -l app=nginx,release=web-server
      exit 0

solution:
  explain: |
    ```bash
    # Upgrade the release to set 3 replicas
    helm upgrade web-server bitnami/nginx --set replicaCount=3

    # Verify the update
    kubectl get pods -l app.kubernetes.io/instance=web-server
    ```
  run: |
    # Upgrade the release to set 3 replicas
    helm upgrade web-server bitnami/nginx --set replicaCount=3

    # Verify the update
    kubectl get pods -l app.kubernetes.io/instance=web-server
