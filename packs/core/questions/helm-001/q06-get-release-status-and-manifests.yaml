# yaml-language-server: $schema=../../../schema/question.schema.json
# Converted from CK-X helm-001 question 6
title: Get Release Status and Manifests
certifications:  # review: domains guessed from concepts
  cka: cluster-architecture
  ckad: application-deployment
difficulty: medium
namespace: default
tags: [helm, release inspection]

statement: |
  Get the status of the `web-server` release and save the output to a file at `/tmp/exam/q6/web-server-status.txt`.

  Also, get a summary of the manifests rendered by the chart and save them to `/tmp/exam/q6/web-server-manifests.txt`.

setup: |
  # Setup environment for Question 6 - Get Release Status

  # Create necessary directories
  mkdir -p /tmp/exam/q6

  # No other specific setup needed for this question
  # The student needs to get the status of the web-server release
  # and save the output to /tmp/exam/q6/web-server-status.txt
  # They also need to get the manifest summary and save it to /tmp/exam/q6/web-server-manifests.txt

  echo "Environment setup complete for Question 6"
  exit 0

checks:
  - name: Release status is saved correctly
    weight: 2
    run: |
      # Validate script for Question 6, Step 1: Check if release status is saved correctly

      # Check if the status file exists
      if [ ! -f /tmp/exam/q6/web-server-status.txt ]; then
        echo "❌ Release status file does not exist at /tmp/exam/q6/web-server-status.txt"
        exit 1
      fi

      # Check if the file has content
      if [ ! -s /tmp/exam/q6/web-server-status.txt ]; then
        echo "❌ Release status file exists but is empty"
        exit 1
      fi

      # Check if the file contains Helm status information
      if ! grep -q "NAME: web-server" /tmp/exam/q6/web-server-status.txt; then
        echo "❌ Status file does not contain information for release 'web-server'"
        echo "File content:"
        cat /tmp/exam/q6/web-server-status.txt
        exit 1
      fi

      # Check for key status sections
      if ! grep -q "LAST DEPLOYED:" /tmp/exam/q6/web-server-status.txt || \
         ! grep -q "NAMESPACE:" /tmp/exam/q6/web-server-status.txt || \
         ! grep -q "STATUS:" /tmp/exam/q6/web-server-status.txt; then
        echo "❌ Status file does not contain complete status information"
        echo "Expected to find sections like 'LAST DEPLOYED', 'NAMESPACE', 'STATUS'"
        echo "File content:"
        cat /tmp/exam/q6/web-server-status.txt
        exit 1
      fi

      echo "✅ Release status is correctly saved"
      echo "Sample content:"
      head -10 /tmp/exam/q6/web-server-status.txt
      exit 0
  - name: Manifest summary is saved correctly
    weight: 2
    run: |
      # Validate script for Question 6, Step 2: Check if manifests summary is saved correctly

      # Check if the manifests file exists
      if [ ! -f /tmp/exam/q6/web-server-manifests.txt ]; then
        echo "❌ Manifests file does not exist at /tmp/exam/q6/web-server-manifests.txt"
        exit 1
      fi

      # Check if the file has content
      if [ ! -s /tmp/exam/q6/web-server-manifests.txt ]; then
        echo "❌ Manifests file exists but is empty"
        exit 1
      fi

      # Check if the file contains Kubernetes manifest information
      if ! grep -q "apiVersion\|kind\|metadata" /tmp/exam/q6/web-server-manifests.txt; then
        echo "❌ Manifests file does not contain Kubernetes manifest information"
        echo "Expected to find Kubernetes manifest contents with 'apiVersion', 'kind', 'metadata', etc."
        echo "File content:"
        cat /tmp/exam/q6/web-server-manifests.txt
        exit 1
      fi

      # Check if it contains the expected resource types for an nginx deployment
      if ! grep -q "Deployment" /tmp/exam/q6/web-server-manifests.txt || \
         ! grep -q "Service" /tmp/exam/q6/web-server-manifests.txt; then
        echo "❌ Manifests file does not contain expected resource types"
        echo "Expected to find at least Deployment and Service resources"
        echo "File content snippet:"
        head -20 /tmp/exam/q6/web-server-manifests.txt
        exit 1
      fi

      echo "✅ Release manifests are correctly saved"
      echo "Sample content:"
      head -10 /tmp/exam/q6/web-server-manifests.txt
      exit 0

solution:
  explain: |
    ```bash
    # Get status of the web-server release
    helm status web-server > /tmp/exam/q6/web-server-status.txt

    # Get the manifests rendered by the chart
    helm get manifest web-server > /tmp/exam/q6/web-server-manifests.txt
    ```
  # review: commands extracted from the CK-X answer; `ckdry lab verify` confirms them
  run: |
    # Get status of the web-server release
    helm status web-server > /tmp/exam/q6/web-server-status.txt

    # Get the manifests rendered by the chart
    helm get manifest web-server > /tmp/exam/q6/web-server-manifests.txt
