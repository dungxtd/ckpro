# Builds the macOS app (arm64 and x86_64, one DMG each), the Windows app (x64
# and arm64, an installer each) and the Linux app (x64 and arm64, an AppImage
# and a .deb each) for a version tag, side by side, into a draft of this
# repo's GitHub Release; once every build is in, writes latest.json (what the
# app's updater reads) and publishes the release, then points the Homebrew
# cask in dungxtd/homebrew-tap at the DMGs and the AppImages (Homebrew
# installs casks on Linux too):
#   brew install --cask dungxtd/tap/ckpro
# The updates are signed with TAURI_SIGNING_PRIVATE_KEY (and its
# _PASSWORD): the private half of the key whose public half is the updater's
# pubkey in tauri.conf.json. Writing to the tap uses the
# HOMEBREW_TAP_DEPLOY_KEY secret: the private half of a deploy key that may
# write to dungxtd/homebrew-tap and nothing else.
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only (no release, no cask bump)
        type: boolean
        default: true
      cask_tag:
        description: Only point the cask at this published release (e.g. v0.2.0); nothing is built
        type: string
        default: ''

env:
  # Public PostHog project key, baked into the interface at build time
  VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
  # The updates' signing key (each bundle is signed for the updater)
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

permissions:
  contents: write

jobs:
  # The release, as a draft the builds upload into: nobody (and no updater)
  # sees it until every build is in and latest.json is written
  draft:
    if: ${{ !inputs.cask_tag && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: The updates can be signed and checked
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_KEY" ]] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          pubkey="$(jq -r '.plugins.updater.pubkey' desktop/src-tauri/tauri.conf.json)"
          [[ -n "$pubkey" && "$pubkey" != null ]] || { echo "::error::the updater's pubkey in tauri.conf.json is empty"; exit 1; }

      - name: Make the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Again (a run tried twice): the draft there is used
          if gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            echo "The draft is there"
            exit 0
          fi
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  build-macos:
    needs: draft
    # After the draft, or alone for a dry run (no draft)
    if: ${{ !cancelled() && !inputs.cask_tag && needs.draft.result != 'failure' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64, label: macos-arm64 }
          - { target: x86_64-apple-darwin, arch: x86_64, label: macos-x64 }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/sync-version-from-tag

      - uses: ./.github/actions/setup-build-env
        with:
          rust-target: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          # Source maps go to PostHog once per release (the interface is the
          # same on both architectures), then are removed from the bundle
          POSTHOG_CLI_API_KEY: ${{ matrix.arch == 'arm64' && inputs.dry_run != true && secrets.POSTHOG_CLI_API_KEY || '' }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: https://us.posthog.com
        run: pnpm run build --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.updater.conf.json

      - name: Collect the DMG and the update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          bundle=desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          for f in "$bundle"/dmg/*.dmg; do
            cp "$f" "_artifacts/ckpro_${{ matrix.label }}_$(basename "$f" | sed 's/^CKPro_/ckpro_/')"
          done
          # The app, as the updater installs it, and its signature (both
          # architectures make CKPro.app.tar.gz: named by label and version)
          version="$(jq -r .version desktop/src-tauri/tauri.conf.json)"
          cp "$bundle"/macos/*.app.tar.gz "_artifacts/ckpro_${{ matrix.label }}_${version}.app.tar.gz"
          cp "$bundle"/macos/*.app.tar.gz.sig "_artifacts/ckpro_${{ matrix.label }}_${version}.app.tar.gz.sig"
          ls -la _artifacts

      - name: Keep the DMG with the run
        uses: actions/upload-artifact@v4
        with:
          name: ckpro-${{ matrix.label }}
          path: _artifacts/*
          retention-days: 7

      - name: Upload into the draft
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" _artifacts/* --clobber

  build-windows:
    needs: draft
    if: ${{ !cancelled() && !inputs.cask_tag && needs.draft.result != 'failure' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, label: windows-x64 }
          # Built on the x64 runner for Windows on Arm (Snapdragon)
          - { target: aarch64-pc-windows-msvc, label: windows-arm64 }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/sync-version-from-tag

      - uses: ./.github/actions/setup-build-env
        with:
          rust-target: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        working-directory: desktop
        run: pnpm run build --target ${{ matrix.target }} --bundles nsis --config src-tauri/tauri.updater.conf.json

      - name: Collect the installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          # The installer, and its signature for the updater
          for f in desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe{,.sig}; do
            cp "$f" "_artifacts/ckpro_${{ matrix.label }}_$(basename "$f" | sed 's/^CKPro_/ckpro_/')"
          done
          ls -la _artifacts

      - name: Keep the installer with the run
        uses: actions/upload-artifact@v4
        with:
          name: ckpro-${{ matrix.label }}
          path: _artifacts/*
          retention-days: 7

      - name: Upload into the draft
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" _artifacts/* --clobber

  build-linux:
    needs: draft
    if: ${{ !cancelled() && !inputs.cask_tag && needs.draft.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: its glibc runs on the most systems
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: linux-x64 }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, label: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/sync-version-from-tag

      - uses: ./.github/actions/setup-build-env
        with:
          rust-target: ${{ matrix.target }}

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        working-directory: desktop
        run: pnpm run build --target ${{ matrix.target }} --bundles appimage,deb --config src-tauri/tauri.updater.conf.json

      - name: Collect the packages
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          bundle=desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          # The packages, and their signatures for the updater
          for f in "$bundle"/appimage/*.AppImage{,.sig} "$bundle"/deb/*.deb{,.sig}; do
            cp "$f" "_artifacts/ckpro_${{ matrix.label }}_$(basename "$f" | sed 's/^CKPro_/ckpro_/')"
          done
          ls -la _artifacts

      - name: Keep the packages with the run
        uses: actions/upload-artifact@v4
        with:
          name: ckpro-${{ matrix.label }}
          path: _artifacts/*
          retention-days: 7

      - name: Upload into the draft
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" _artifacts/* --clobber

  # Every build in: latest.json from their signatures, then the release is
  # published (the updaters see it from here, all platforms at once)
  publish:
    needs: [build-macos, build-windows, build-linux]
    if: ${{ !cancelled() && !inputs.cask_tag && inputs.dry_run != true && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Write latest.json and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p sigs
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir sigs --clobber
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          scripts/latest-json.sh "$GITHUB_REF_NAME" sigs "$RUNNER_TEMP/notes.md" > latest.json
          jq . latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  cask:
    needs: [publish]
    # After the release of a tag is published, or alone for a release named
    # by cask_tag
    if: >-
      ${{ !cancelled() && (inputs.cask_tag != '' && inputs.cask_tag != null
      || inputs.dry_run != true && needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      # The cask lives in the shared tap; the installers stay on this repo's releases
      - uses: actions/checkout@v5
        with:
          repository: dungxtd/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          ref: main

      - name: Point the cask at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.cask_tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p pkg
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern '*.AppImage' --dir pkg
          sha() { shasum -a 256 "$(find pkg -name "$1" | head -n 1)" | awk '{print $1}'; }
          # The macOS DMGs and the Linux AppImages, each under its sha256 key
          sed -i -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/(arm: +)\"[0-9a-f]{64}\"/\1\"$(sha '*_macos-arm64_*.dmg')\"/" \
            -e "s/(intel: +)\"[0-9a-f]{64}\"/\1\"$(sha '*_macos-x64_*.dmg')\"/" \
            -e "s/(arm64_linux: +)\"[0-9a-f]{64}\"/\1\"$(sha '*_linux-arm64_*.AppImage')\"/" \
            -e "s/(x86_64_linux: +)\"[0-9a-f]{64}\"/\1\"$(sha '*_linux-x64_*.AppImage')\"/" \
            Casks/ckpro.rb
          cat Casks/ckpro.rb
          if git diff --quiet Casks/ckpro.rb; then
            echo "Cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(ckpro): point to ${TAG}"
          git pull --rebase origin main
          git push origin main
