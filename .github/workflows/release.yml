# Builds the macOS app (arm64 and x86_64, one DMG each), the Windows app (x64
# and arm64, an installer each) and the Linux app (x64 and arm64, an AppImage
# and a .deb each) for a version tag, side by side, publishes them on this
# repo's GitHub Release, then points the Homebrew cask in dungxtd/homebrew-tap
# at the DMGs and the AppImages (Homebrew installs casks on Linux too):
#   brew install --cask dungxtd/tap/ckpro
# Writing to the tap uses the HOMEBREW_TAP_DEPLOY_KEY secret: the private half
# of a deploy key that may write to dungxtd/homebrew-tap and nothing else.
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only (no release, no cask bump)
        type: boolean
        default: true
      cask_tag:
        description: Only point the cask at this published release (e.g. v0.2.0); nothing is built
        type: string
        default: ''

env:
  # Public PostHog project key, baked into the interface at build time
  VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

permissions:
  contents: write

jobs:
  build-macos:
    if: ${{ !inputs.cask_tag }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64, label: macos-arm64 }
          - { target: x86_64-apple-darwin, arch: x86_64, label: macos-x64 }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/sync-version-from-tag

      - uses: ./.github/actions/setup-build-env
        with:
          rust-target: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          # Source maps go to PostHog once per release (the interface is the
          # same on both architectures), then are removed from the bundle
          POSTHOG_CLI_API_KEY: ${{ matrix.arch == 'arm64' && inputs.dry_run != true && secrets.POSTHOG_CLI_API_KEY || '' }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: https://us.posthog.com
        run: pnpm run build --target ${{ matrix.target }} --bundles app,dmg

      - name: Collect the DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          for f in desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            cp "$f" "_artifacts/ckpro_${{ matrix.label }}_$(basename "$f")"
          done
          ls -la _artifacts

      - name: Keep the DMG with the run
        uses: actions/upload-artifact@v4
        with:
          name: ckpro-${{ matrix.label }}
          path: _artifacts/*.dmg
          retention-days: 7

      - name: Publish to the GitHub Release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Whichever leg comes first makes the release; the others upload beside it
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" _artifacts/*.dmg --clobber

  build-windows:
    if: ${{ !inputs.cask_tag }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, label: windows-x64 }
          # Built on the x64 runner for Windows on Arm (Snapdragon)
          - { target: aarch64-pc-windows-msvc, label: windows-arm64 }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/sync-version-from-tag

      - uses: ./.github/actions/setup-build-env
        with:
          rust-target: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        working-directory: desktop
        run: pnpm run build --target ${{ matrix.target }} --bundles nsis

      - name: Collect the installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          for f in desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe; do
            cp "$f" "_artifacts/ckpro_${{ matrix.label }}_$(basename "$f")"
          done
          ls -la _artifacts

      - name: Keep the installer with the run
        uses: actions/upload-artifact@v4
        with:
          name: ckpro-${{ matrix.label }}
          path: _artifacts/*.exe
          retention-days: 7

      - name: Publish to the GitHub Release
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Whichever leg comes first makes the release; the others upload beside it
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" _artifacts/*.exe --clobber

  build-linux:
    if: ${{ !inputs.cask_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: its glibc runs on the most systems
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: linux-x64 }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, label: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/sync-version-from-tag

      - uses: ./.github/actions/setup-build-env
        with:
          rust-target: ${{ matrix.target }}

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        working-directory: desktop
        run: pnpm run build --target ${{ matrix.target }} --bundles appimage,deb

      - name: Collect the packages
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          bundle=desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          for f in "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb; do
            cp "$f" "_artifacts/ckpro_${{ matrix.label }}_$(basename "$f")"
          done
          ls -la _artifacts

      - name: Keep the packages with the run
        uses: actions/upload-artifact@v4
        with:
          name: ckpro-${{ matrix.label }}
          path: _artifacts/*
          retention-days: 7

      - name: Publish to the GitHub Release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Whichever leg comes first makes the release; the others upload beside it
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" _artifacts/* --clobber

  cask:
    needs: [build-macos, build-linux]
    # After the macOS and Linux builds of a tag, or alone for a release named
    # by cask_tag
    if: >-
      ${{ !cancelled() && (inputs.cask_tag != '' && inputs.cask_tag != null
      || inputs.dry_run != true && needs.build-macos.result == 'success' && needs.build-linux.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      # The cask lives in the shared tap; the installers stay on this repo's releases
      - uses: actions/checkout@v5
        with:
          repository: dungxtd/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          ref: main

      - name: Point the cask at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.cask_tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p pkg
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern '*.AppImage' --dir pkg
          sha() { shasum -a 256 "$(find pkg -name "$1" | head -n 1)" | awk '{print $1}'; }
          # The macOS DMGs and the Linux AppImages, each under its sha256 key
          sed -i -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/(arm: +)\"[0-9a-f]{64}\"/\1\"$(sha '*_macos-arm64_*.dmg')\"/" \
            -e "s/(intel: +)\"[0-9a-f]{64}\"/\1\"$(sha '*_macos-x64_*.dmg')\"/" \
            -e "s/(arm64_linux: +)\"[0-9a-f]{64}\"/\1\"$(sha '*_linux-arm64_*.AppImage')\"/" \
            -e "s/(x86_64_linux: +)\"[0-9a-f]{64}\"/\1\"$(sha '*_linux-x64_*.AppImage')\"/" \
            Casks/ckpro.rb
          cat Casks/ckpro.rb
          if git diff --quiet Casks/ckpro.rb; then
            echo "Cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(ckpro): point to ${TAG}"
          git pull --rebase origin main
          git push origin main
