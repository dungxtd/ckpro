name: Set up Linux for the Rust side
description: The system libraries Tauri builds against on Linux, Rust stable and its cache, and the interface's placeholder the build embeds.

runs:
  using: composite
  steps:
    - name: System libraries
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
          libayatana-appindicator3-dev libssl-dev pkg-config

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: desktop/src-tauri -> target

    # The build embeds the interface (frontendDist); the tests do not need it built
    - name: Interface placeholder
      shell: bash
      run: mkdir -p desktop/dist && [ -f desktop/dist/index.html ] || echo '<!doctype html>' > desktop/dist/index.html
