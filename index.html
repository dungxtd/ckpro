<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CKX Desktop</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header>
      <strong>CKX Desktop</strong>
      <span id="docker-status">Docker: checking…</span>
    </header>

    <section class="panel">
      <h2>Cluster</h2>
      <form id="cluster-form" class="row">
        <label>Name <input id="cluster-name" value="k8s" pattern="[a-z][a-z0-9-]*" required /></label>
        <label>Workers <input id="cluster-workers" type="number" min="0" max="9" value="1" /></label>
        <button id="create-btn" type="submit">Create</button>
        <button id="delete-btn" type="button">Delete</button>
        <span id="cluster-state"></span>
      </form>
      <pre id="cluster-log"></pre>
    </section>

    <section class="panel">
      <h2>Lab script</h2>
      <form id="script-form" class="row">
        <input id="script-path" class="grow" />
        <button type="submit">Run</button>
      </form>
      <pre id="script-output"></pre>
    </section>

    <section class="panel terminal-panel">
      <h2>Terminal <button id="term-btn" type="button">Open shell on control plane</button></h2>
      <div id="terminal"></div>
    </section>
  </body>
</html>
